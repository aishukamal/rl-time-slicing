apiVersion: v1
kind: Service
metadata:
  name: ray-head-svc
  namespace: default
spec:
  selector:
    app: async-timeslice-ray-head
  ports:
  - name: gcs
    port: 6379
    targetPort: 6379
  - name: dashboard
    port: 8265
    targetPort: 8265
  - name: client
    port: 10001
    targetPort: 10001
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: async-timeslice-scripts
  namespace: default
data:
  collect_worker_gpu.py: |
    #!/usr/bin/env python3
    import ray, sys, os
    ray.init(address="auto", ignore_reinit_error=True)
    @ray.remote(num_cpus=0.01)
    def read_csv():
        try:
            return open("/workspace/results/gpu_util_rollouter.csv").read()
        except Exception as e:
            return ""
    worker_ip = "10.138.0.24"
    out_path = sys.argv[1] if len(sys.argv) > 1 else "/tmp/worker_gpu.csv"
    nodes = [n for n in ray.nodes() if n["Alive"] and n["NodeManagerAddress"] == worker_ip]
    if nodes:
        nid = nodes[0]["NodeID"]
        strat = ray.util.scheduling_strategies.NodeAffinitySchedulingStrategy(node_id=nid, soft=False)
        data = ray.get(read_csv.options(scheduling_strategy=strat).remote())
        if data:
            with open(out_path, "w") as f:
                f.write(data)
            print("Collected " + str(len(data)) + " bytes -> " + out_path)
        else:
            print("Worker GPU trace empty")
    else:
        print("Worker node not found at " + worker_ip)

  gpu_monitor.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    OUTPUT="${1:?Usage: $0 <output.csv> [interval_ms]}"
    INTERVAL_MS="${2:-100}"
    echo "timestamp_ms,gpu_index,gpu_util_pct,mem_util_pct,power_w" > "$OUTPUT"
    trap 'exit 0' SIGINT SIGTERM
    SLEEP_S=$(python3 -c "print($INTERVAL_MS/1000)")
    while true; do
        ts=$(date +%s%3N)
        nvidia-smi --query-gpu=index,utilization.gpu,utilization.memory,power.draw \
                   --format=csv,noheader,nounits 2>/dev/null | \
        while IFS=', ' read -r idx gpu mem pwr; do
            echo "${ts},${idx},${gpu},${mem},${pwr}"
        done >> "$OUTPUT"
        sleep "$SLEEP_S"
    done

  setup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    echo "=== Setup on $(hostname) ==="
    nvidia-smi -L

    pip install datasets 2>&1 | tail -3
    pip install "verl @ git+https://github.com/verl-project/verl.git@main" --no-deps 2>&1 | tail -3
    pip install cupy-cuda12x 2>&1 | tail -3
    python3 -c "import verl; print('verl ok')"

    MODEL_PATH="/workspace/models/Qwen2.5-7B-Instruct"
    if [ ! -d "$MODEL_PATH" ]; then
        echo "=== Downloading model ==="
        hf download Qwen/Qwen2.5-7B-Instruct --local-dir "$MODEL_PATH" 2>&1 || \
          python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen2.5-7B-Instruct', local_dir='$MODEL_PATH')"
    fi

    TRAIN_FILE="/workspace/data/gsm8k/train.parquet"
    if [ ! -f "$TRAIN_FILE" ]; then
        echo "=== Downloading dataset ==="
        mkdir -p /workspace/data/gsm8k
        python3 << 'PYEOF'
    import json
    from datasets import load_dataset

    d = load_dataset('openai/gsm8k', 'main')
    for split, path in [("train", "/workspace/data/gsm8k/train.parquet"), ("test", "/workspace/data/gsm8k/test.parquet")]:
        ds = d[split].map(lambda ex: {"prompt": json.dumps([{"role": "user", "content": ex["question"]}]), "data_source": "gsm8k"})
        ds = ds.select_columns(["prompt", "data_source"])
        ds.to_parquet(path)
        print(f"{split}: {len(ds)} samples -> {path}")
    PYEOF
    fi
    echo "=== Setup complete ==="

  run_modes.sh: |
    #!/usr/bin/env bash
    set -xeuo pipefail

    RESULTS_DIR="/workspace/results"
    MODEL_PATH="/workspace/models/Qwen2.5-7B-Instruct"
    TRAIN_FILE="/workspace/data/gsm8k/train.parquet"
    TEST_FILE="/workspace/data/gsm8k/test.parquet"
    TOTAL_ROLLOUT_STEPS=2048

    mkdir -p "$RESULTS_DIR"

    COMMON_PARAMS=(
        data.train_files="$TRAIN_FILE"
        data.val_files="$TEST_FILE"
        data.prompt_key=prompt
        data.truncation=left
        data.max_prompt_length=1024
        data.max_response_length=2048
        data.train_batch_size=0
        data.gen_batch_size=1
        data.return_raw_chat=True
        actor_rollout_ref.rollout.n=16
        actor_rollout_ref.rollout.calculate_log_probs=True
        algorithm.adv_estimator=grpo
        algorithm.use_kl_in_reward=False
        algorithm.kl_ctrl.kl_coef=0.0
        actor_rollout_ref.hybrid_engine=False
        actor_rollout_ref.actor.use_kl_loss=False
        actor_rollout_ref.actor.kl_loss_coef=0.0
        actor_rollout_ref.actor.clip_ratio_low=0.2
        actor_rollout_ref.actor.clip_ratio_high=0.28
        actor_rollout_ref.actor.clip_ratio_c=10.0
        actor_rollout_ref.model.path="$MODEL_PATH"
        actor_rollout_ref.model.use_remove_padding=True
        actor_rollout_ref.model.enable_gradient_checkpointing=True
        actor_rollout_ref.actor.optim.lr=1e-6
        actor_rollout_ref.actor.optim.lr_warmup_steps=-1
        actor_rollout_ref.actor.optim.weight_decay=0.1
        actor_rollout_ref.actor.ppo_mini_batch_size=32
        actor_rollout_ref.actor.entropy_coeff=0
        actor_rollout_ref.actor.grad_clip=1.0
        actor_rollout_ref.actor.loss_agg_mode=token-mean
        actor_rollout_ref.actor.use_dynamic_bsz=True
        actor_rollout_ref.ref.log_prob_use_dynamic_bsz=True
        actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=True
        actor_rollout_ref.actor.fsdp_config.strategy=fsdp2
        actor_rollout_ref.actor.fsdp_config.fsdp_size=2
        actor_rollout_ref.actor.fsdp_config.param_offload=False
        actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
        actor_rollout_ref.ref.fsdp_config.param_offload=True
        actor_rollout_ref.actor.ulysses_sequence_parallel_size=1
        actor_rollout_ref.ref.ulysses_sequence_parallel_size=1
        critic.strategy=fsdp2
        actor_rollout_ref.rollout.gpu_memory_utilization=0.85
        actor_rollout_ref.rollout.tensor_model_parallel_size=2
        actor_rollout_ref.rollout.enable_chunked_prefill=True
        actor_rollout_ref.rollout.temperature=1.0
        actor_rollout_ref.rollout.top_p=1.0
        actor_rollout_ref.rollout.top_k=-1
        actor_rollout_ref.rollout.name=vllm
        actor_rollout_ref.rollout.mode=async
        actor_rollout_ref.rollout.checkpoint_engine.backend=nccl
        reward.reward_manager.name=dapo
        +reward.reward_kwargs.overlong_buffer_cfg.enable=True
        +reward.reward_kwargs.overlong_buffer_cfg.len=512
        +reward.reward_kwargs.overlong_buffer_cfg.penalty_factor=1.0
        +reward.reward_kwargs.overlong_buffer_cfg.log=False
        +reward.reward_kwargs.max_resp_len=2048
        trainer.logger="['console']"
        trainer.val_before_train=False
        trainer.save_freq=-1
        trainer.resume_mode=disable
        trainer.nnodes=1
        trainer.n_gpus_per_node=2
        trainer.total_epochs=2
        trainer.test_freq=-1
        rollout.nnodes=1
        rollout.n_gpus_per_node=2
        rollout.total_rollout_steps="$TOTAL_ROLLOUT_STEPS"
    )

    # Mode configs: name|staleness|sync_step|partial|require_batches
    # Longer phases: sync_step=16, require_batches=8 → 128 mini-batches per cycle
    MODES=(
        "mode1_on_policy_pipeline|0|4|False|8"
        "mode2_stream_offpolicy|0|16|False|8"
        "mode3_async_stale|0.3|16|False|8"
        "mode4_async_partial|0.3|16|True|8"
    )

    export VLLM_USE_V1=1

    for spec in "${MODES[@]}"; do
        IFS='|' read -r name staleness sync_step partial req_batches <<< "$spec"

        echo ""
        echo "================================================================"
        echo " Running: $name"
        echo "   staleness=$staleness  sync_step=$sync_step"
        echo "   partial=$partial  require_batches=$req_batches"
        echo "================================================================"

        run_dir="${RESULTS_DIR}/${name}"
        mkdir -p "$run_dir"

        # Start GPU monitor on BOTH nodes
        bash /workspace/scripts/gpu_monitor.sh "$run_dir/gpu_util_node_cn7z.csv" 100 &
        monitor_head_pid=$!

        date +%s%3N > "$run_dir/start_ts"

        python3 -m verl.experimental.fully_async_policy.fully_async_main \
            "${COMMON_PARAMS[@]}" \
            trainer.project_name="timeslice-experiment" \
            trainer.experiment_name="$name" \
            trainer.default_local_dir="$run_dir/ckpts" \
            async_training.staleness_threshold="$staleness" \
            async_training.trigger_parameter_sync_step="$sync_step" \
            async_training.partial_rollout="$partial" \
            async_training.require_batches="$req_batches" \
            2>&1 | tee "$run_dir/train.log" || {
                echo "WARNING: $name failed, see $run_dir/train.log"
                date +%s%3N > "$run_dir/end_ts"
                kill "$monitor_head_pid" 2>/dev/null || true
                wait "$monitor_head_pid" 2>/dev/null || true
                continue
            }

        date +%s%3N > "$run_dir/end_ts"
        kill "$monitor_head_pid" 2>/dev/null || true
        wait "$monitor_head_pid" 2>/dev/null || true

        # Grab worker node GPU trace via Ray remote task
        python3 /workspace/scripts/collect_worker_gpu.py "${run_dir}/gpu_util_node_5wn5.csv" 2>&1 || echo "Worker GPU collection failed (non-critical)"

        echo "Completed: $name"
    done

    echo ""
    echo "================================================================"
    echo " All modes complete. Results in $RESULTS_DIR"
    echo "================================================================"
    ls -la "$RESULTS_DIR"/mode*/gpu_util_*.csv 2>/dev/null

  analyze_gpu_util.py: |
    #!/usr/bin/env python3
    import csv, os, sys
    from collections import defaultdict
    from pathlib import Path

    IDLE_THRESHOLD = 15.0
    BUSY_THRESHOLD = 50.0
    MIN_PHASE_DURATION_S = 0.5

    def load_trace(csv_path):
        traces = defaultdict(lambda: {"ts": [], "util": []})
        with open(csv_path) as f:
            for row in csv.DictReader(f):
                idx = int(row["gpu_index"])
                traces[idx]["ts"].append(int(row["timestamp_ms"]))
                traces[idx]["util"].append(float(row["gpu_util_pct"]))
        return dict(traces)

    def smooth(vals, w=10):
        out = []
        for i in range(len(vals)):
            s, e = max(0, i-w//2), min(len(vals), i+w//2+1)
            out.append(sum(vals[s:e])/(e-s))
        return out

    def detect_phases(ts, util):
        sm = smooth(util)
        phases, cur, start = [], None, ts[0]
        for t, v in zip(ts, sm):
            st = "busy" if v >= BUSY_THRESHOLD else ("idle" if v <= IDLE_THRESHOLD else "mid")
            if cur is None:
                cur, start = st, t
            elif st != cur and st != "mid":
                if (t-start)/1000 >= MIN_PHASE_DURATION_S:
                    phases.append((cur, start, t))
                cur, start = st, t
        if cur and ts:
            if (ts[-1]-start)/1000 >= MIN_PHASE_DURATION_S:
                phases.append((cur, start, ts[-1]))
        return phases

    def analyze(name, gpu_idx, role, ts, util):
        n = len(util)
        if not n:
            return None
        mean_u = sum(util)/n
        idle_f = sum(1 for u in util if u <= IDLE_THRESHOLD)/n
        busy_f = sum(1 for u in util if u >= BUSY_THRESHOLD)/n
        phases = detect_phases(ts, util)
        busy_d = [(e-s)/1000 for st,s,e in phases if st == "busy"]
        idle_d = [(e-s)/1000 for st,s,e in phases if st == "idle"]
        trans = sum(1 for i in range(1,len(phases)) if phases[i][0] != phases[i-1][0])
        avg_busy = sum(busy_d)/len(busy_d) if busy_d else 0
        avg_idle = sum(idle_d)/len(idle_d) if idle_d else 0
        bimod = min(idle_f, busy_f)/max(idle_f, busy_f, 0.01)
        td = trans/max(len(phases),1)
        cov = idle_f + busy_f
        score = min(1.0, bimod * td * cov * 4)
        is_sq = score > 0.3 and len(busy_d) >= 2 and len(idle_d) >= 2 and idle_f > 0.15 and busy_f > 0.15
        total = sum(busy_d)+sum(idle_d)
        duty = sum(busy_d)/total if total else 0
        return {
            "mode": name, "gpu": gpu_idx, "role": role,
            "mean": mean_u, "idle_f": idle_f, "busy_f": busy_f,
            "trans": trans, "avg_busy": avg_busy, "avg_idle": avg_idle,
            "score": score, "is_sq": is_sq, "duty": duty,
        }

    def main():
        d = Path(sys.argv[1] if len(sys.argv) > 1 else "/workspace/results")
        results = []
        for md in sorted(d.glob("mode*")):
            for csv_file in sorted(md.glob("gpu_util_*.csv")):
                node_role = csv_file.stem.replace("gpu_util_", "")
                traces = load_trace(str(csv_file))
                for gi, tr in sorted(traces.items()):
                    role = f"{node_role}_gpu{gi}"
                    r = analyze(md.name, gi, role, tr["ts"], tr["util"])
                    if r:
                        results.append(r)
                        tag = "██" if r["is_sq"] else "  "
                        print(f"  {tag} {r['mode']} GPU{gi} ({role}): mean={r['mean']:.0f}% "
                              f"idle={r['idle_f']:.0%} busy={r['busy_f']:.0%} "
                              f"trans={r['trans']} score={r['score']:.2f}")

        print("\n" + "="*70)
        print("ASYNC RL TIME-SLICING FEASIBILITY REPORT")
        print("="*70)

        print(f"\n{'Mode':<30} {'GPU':>4} {'Role':<20} {'Mean%':>6} {'Idle%':>6} "
              f"{'Busy%':>6} {'Trans':>6} {'BusyS':>6} {'IdleS':>6} {'Score':>6} {'TS?':>4}")
        print("-"*110)
        for r in results:
            ts = "YES" if r["is_sq"] else " no"
            print(f"{r['mode']:<30} {r['gpu']:>4} {r['role']:<20} {r['mean']:>5.0f}% "
                  f"{r['idle_f']:>5.0%} {r['busy_f']:>5.0%} {r['trans']:>6} "
                  f"{r['avg_busy']:>5.1f}s {r['avg_idle']:>5.1f}s {r['score']:>5.2f} {ts:>4}")

        sq = [r for r in results if r["is_sq"]]
        nosq = [r for r in results if not r["is_sq"]]
        print()
        if sq:
            print("TIME-SLICEABLE:")
            for r in sq:
                print(f"  + {r['mode']} GPU{r['gpu']} ({r['role']}): "
                      f"score={r['score']:.2f}, duty={r['duty']:.0%}, "
                      f"busy={r['avg_busy']:.1f}s idle={r['avg_idle']:.1f}s")
        if nosq:
            print("NOT TIME-SLICEABLE:")
            for r in nosq:
                reasons = []
                if r["idle_f"] < 0.15: reasons.append(f"rarely idle ({r['idle_f']:.0%})")
                if r["busy_f"] < 0.15: reasons.append(f"rarely busy ({r['busy_f']:.0%})")
                if r["trans"] < 3: reasons.append(f"few transitions ({r['trans']})")
                if not reasons: reasons.append(f"low score ({r['score']:.2f})")
                print(f"  - {r['mode']} GPU{r['gpu']} ({r['role']}): {'; '.join(reasons)}")

        modes_sq = set(r["mode"] for r in sq)
        print()
        if not modes_sq:
            print("CONCLUSION: No async mode produced a clear square wave. "
                  "Time-slicing does NOT appear applicable to these async RL configs.")
        elif len(modes_sq) == len(set(r["mode"] for r in results)):
            print("CONCLUSION: ALL async modes show square waves. "
                  "Time-slicing IS applicable to async RL broadly.")
        else:
            print(f"CONCLUSION: Time-slicing applicable to: {', '.join(sorted(modes_sq))}. "
                  "More synchronous async modes retain idle periods; "
                  "higher overlap (modes 3-4) may eliminate them.")

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: Pod
metadata:
  name: ray-head
  namespace: default
  labels:
    app: async-timeslice-ray-head
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: gke-verl-research-clus-h100-2gpu-spot-8cf82ce9-cn7z
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  containers:
  - name: head
    image: verlai/verl:vllm020.dev2
    env:
    - name: VLLM_USE_V1
      value: "1"
    - name: RAY_DEDUP_LOGS
      value: "0"
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -euo pipefail

      # Setup
      bash /workspace/scripts/setup.sh

      # Start Ray head
      ray start --head --port=6379 --dashboard-host=0.0.0.0 --num-gpus=2
      echo "Ray head started, waiting for worker..."

      # Wait for worker to join (4 total GPUs)
      for i in $(seq 1 120); do
          GPU_TOTAL=$(ray status 2>/dev/null | grep -oP '[\d.]+/\K[\d.]+(?=\s+GPU)' || echo "0")
          if python3 -c "exit(0 if float('${GPU_TOTAL}') >= 4.0 else 1)" 2>/dev/null; then
              echo "Ray cluster ready: ${GPU_TOTAL} total GPUs"
              ray status
              break
          fi
          echo "Waiting for worker... ($i/120, total GPUs: ${GPU_TOTAL})"
          sleep 5
      done

      # Verify cluster
      GPU_TOTAL=$(ray status 2>/dev/null | grep -oP '[\d.]+/\K[\d.]+(?=\s+GPU)' || echo "0")
      if ! python3 -c "exit(0 if float('${GPU_TOTAL}') >= 4.0 else 1)" 2>/dev/null; then
          echo "ERROR: Only ${GPU_TOTAL} GPUs in cluster, need 4"
          ray status
          exit 1
      fi

      # Run experiment
      echo "=== Starting experiment ==="
      bash /workspace/scripts/run_modes.sh 2>&1 | tee /workspace/results/experiment.log

      # Merge rollouter GPU traces if worker exported them
      # (worker writes to a shared NFS or we collect after)

      # Run analysis
      echo "=== Running analysis ==="
      python3 /workspace/scripts/analyze_gpu_util.py /workspace/results 2>&1 | tee /workspace/results/analysis.log

      echo "=== Experiment complete ==="
      # Keep pod alive so raw CSVs can be extracted
      echo "Pod staying alive for data extraction. Run:"
      echo "  kubectl cp ray-head:/workspace/results ./results"
      sleep 600
    resources:
      limits:
        nvidia.com/gpu: 2
      requests:
        nvidia.com/gpu: 2
        cpu: "8"
        memory: "48Gi"
    ports:
    - containerPort: 6379
      name: gcs
    - containerPort: 8265
      name: dashboard
    - containerPort: 10001
      name: client
    volumeMounts:
    - name: scripts
      mountPath: /workspace/scripts
    - name: results
      mountPath: /workspace/results
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: scripts
    configMap:
      name: async-timeslice-scripts
      defaultMode: 0755
  - name: results
    emptyDir: {}
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ray-worker
  namespace: default
  labels:
    app: async-timeslice-ray-worker
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: gke-verl-research-clus-h100-2gpu-spot-8cf82ce9-5wn5
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  containers:
  - name: worker
    image: verlai/verl:vllm020.dev2
    env:
    - name: VLLM_USE_V1
      value: "1"
    - name: RAY_DEDUP_LOGS
      value: "0"
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -euo pipefail

      # Setup (same model + deps on worker node)
      bash /workspace/scripts/setup.sh

      # Head node internal IP (cn7z = 10.138.0.22)
      HEAD_IP="10.138.0.22"

      echo "Connecting to Ray head at ${HEAD_IP}:6379..."

      # Wait for head to be ready
      for i in $(seq 1 60); do
          if ray start --address="${HEAD_IP}:6379" --num-gpus=2 2>/dev/null; then
              echo "Connected to Ray head"
              break
          fi
          echo "Waiting for head... ($i/60)"
          sleep 5
      done

      ray status || { echo "Failed to join Ray cluster"; exit 1; }

      # Start GPU monitor for rollouter GPUs
      mkdir -p /workspace/results
      bash /workspace/scripts/gpu_monitor.sh /workspace/results/gpu_util_rollouter.csv 100 &
      MONITOR_PID=$!

      echo "Worker ready. GPU monitor running. Waiting for experiment to complete..."

      # Block until Ray is shut down by the head or experiment ends
      # Ray worker process stays alive as long as the head is running
      while ray status >/dev/null 2>&1; do
          sleep 10
      done

      # Stop GPU monitor
      kill $MONITOR_PID 2>/dev/null || true
      wait $MONITOR_PID 2>/dev/null || true

      echo "Worker done. Rollouter GPU trace at /workspace/results/gpu_util_rollouter.csv"
      # Keep alive briefly for log collection
      sleep 30
    resources:
      limits:
        nvidia.com/gpu: 2
      requests:
        nvidia.com/gpu: 2
        cpu: "8"
        memory: "48Gi"
    volumeMounts:
    - name: scripts
      mountPath: /workspace/scripts
    - name: results
      mountPath: /workspace/results
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: scripts
    configMap:
      name: async-timeslice-scripts
      defaultMode: 0755
  - name: results
    emptyDir: {}
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
