apiVersion: batch/v1
kind: Job
metadata:
  name: disagg-deepresearch
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: disagg-deepresearch
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-mega-80gb
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - h100-mega-8gpu-spot-b
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: benchmark
        image: verlai/verl:vllm017.latest
        env:
        - name: DEBIAN_FRONTEND
          value: "noninteractive"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo "=== Disaggregated Deep-Research Multi-Turn Benchmark ==="
          echo "Node: $(hostname)"
          echo "Date: $(date)"
          nvidia-smi
          echo ""
          mkdir -p /workspace/results
          bash /workspace/scripts/setup_and_run_disagg.sh 2>&1 | tee /workspace/results/experiment.log
        resources:
          limits:
            nvidia.com/gpu: 2
          requests:
            nvidia.com/gpu: 2
            cpu: "40"
            memory: "200Gi"
        volumeMounts:
        - name: scripts
          mountPath: /workspace/scripts
        - name: code
          mountPath: /workspace/code
        - name: results
          mountPath: /workspace/results
        - name: dshm
          mountPath: /dev/shm
      # Search sidecar: pyserini BM25 Wikipedia server (Serper-format API).
      # Reuses the colocated benchmark image, which already has pyserini +
      # JDK + the 12GB index bootstrap. Shares localhost with the main
      # container (same pod network namespace).
      - name: search
        image: us-west1-docker.pkg.dev/aishuk-test/tpu-poc-repo/deepresearch-benchmark:latest
        env:
        - name: SEARCH_PORT
          value: "8877"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo "=== Local Wikipedia search server (pyserini BM25) ==="
          python3 /workspace/scripts/local_search_server.py
        resources:
          requests:
            cpu: "8"
            memory: "40Gi"
          limits:
            memory: "60Gi"
        volumeMounts:
        - name: scripts
          mountPath: /workspace/scripts
      volumes:
      - name: scripts
        configMap:
          name: disagg-deepresearch-scripts
          defaultMode: 0755
      - name: code
        configMap:
          name: disagg-deepresearch-code
      - name: results
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
