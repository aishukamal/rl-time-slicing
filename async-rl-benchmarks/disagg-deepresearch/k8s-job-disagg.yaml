apiVersion: v1
kind: ConfigMap
metadata:
  name: disagg-deepresearch-scripts
  namespace: default
data:
  gpu_monitor.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    OUTPUT="${1:?Usage: $0 <output.csv> [interval_ms]}"
    INTERVAL_MS="${2:-100}"
    echo "timestamp_ms,gpu_index,gpu_util_pct,mem_util_pct,power_w" > "$OUTPUT"
    trap 'exit 0' SIGINT SIGTERM
    SLEEP_S=$(python3 -c "print($INTERVAL_MS/1000)")
    while true; do
        ts=$(date +%s%3N)
        nvidia-smi --query-gpu=index,utilization.gpu,utilization.memory,power.draw \
                   --format=csv,noheader,nounits 2>/dev/null | \
        while IFS=', ' read -r idx gpu mem pwr; do
            echo "${ts},${idx},${gpu},${mem},${pwr}"
        done >> "$OUTPUT"
        sleep "$SLEEP_S"
    done

  local_search_server.py: |
    #!/usr/bin/env python3
    """Local Wikipedia BM25 search server matching Serper API format.

    Identical to the one used by the colocated benchmark
    (GPU-CR/benchmark-deepresearch/k8s-job.yaml) — runs in the
    deepresearch-benchmark image (has pyserini + JDK), downloads the ~12GB
    wikipedia-dpr-100w prebuilt index on first start.
    """
    import json
    import os
    from http.server import HTTPServer, BaseHTTPRequestHandler

    SEARCHER = None


    def init_searcher():
        global SEARCHER
        print("Loading pyserini Wikipedia index (this may take a few minutes)...")
        from pyserini.search.lucene import LuceneSearcher
        SEARCHER = LuceneSearcher.from_prebuilt_index('wikipedia-dpr-100w')
        if SEARCHER is None:
            raise RuntimeError("Failed to load pyserini prebuilt index wikipedia-dpr-100w")
        print("Search index loaded. Ready to serve.")


    class SearchHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(content_length)
            try:
                data = json.loads(body)
                query = data.get('q', '')
                num_results = data.get('num', 10)
            except Exception:
                self.send_response(400)
                self.end_headers()
                self.wfile.write(b'{"error": "invalid json"}')
                return

            results = []
            if SEARCHER and query:
                hits = SEARCHER.search(query, k=num_results)
                for hit in hits:
                    doc = SEARCHER.doc(hit.docid)
                    raw = json.loads(doc.raw()) if doc.raw() else {}
                    contents = raw.get('contents', doc.raw() or '')
                    if not isinstance(contents, str):
                        contents = str(contents)
                    title = raw.get('title', '')
                    # DPR-100w format: contents = "Title"\npassage text
                    if not title and contents.startswith('"'):
                        first, _, rest = contents.partition('\n')
                        title = first.strip('"')
                        contents = rest or contents
                    if not title:
                        title = str(hit.docid)
                    snippet = contents[:500]
                    results.append({
                        'title': title,
                        'link': f'https://en.wikipedia.org/wiki/{title.replace(" ", "_")}',
                        'snippet': snippet,
                        'date': '',
                        'source': 'wikipedia'
                    })

            response = json.dumps({
                'searchParameters': {'q': query},
                'organic': results
            })
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(response.encode())

        def log_message(self, format, *args):
            pass


    if __name__ == '__main__':
        port = int(os.environ.get('SEARCH_PORT', '8877'))
        init_searcher()
        server = HTTPServer(('0.0.0.0', port), SearchHandler)
        print(f"Search server running on port {port}")
        server.serve_forever()

  setup_and_run_disagg.sh: |
    #!/usr/bin/env bash
    # Disaggregated deep-research benchmark — main container entrypoint.
    # 1 trainer GPU (FSDP) + 1 sampler GPU (server-mode vLLM), CMU multi-turn
    # rollout in the sampler phase, local Wikipedia search sidecar on :8877.
    set -xeuo pipefail

    # On ANY exit, kill background children (gpu monitor). Otherwise they hold
    # the stdout pipe to tee open and the container hangs instead of surfacing
    # the failure in pod status.
    trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

    RESULTS_DIR="/workspace/results"
    MODEL_PATH="/workspace/models/Qwen2.5-3B-Instruct"
    SEARCH_PORT=8877
    # Pinned commits — the port was written and API-verified against these exact
    # trees. Do NOT float to HEAD (AgentLoopManager/CheckpointEngineManager APIs
    # drift; see timeslice-deepresearch docstrings).
    VERL_COMMIT="a35908ca3c9632859c58d6a2855d858918ae21dc"
    CMU_COMMIT="9c311053d607d9c63d3f148f03f712cc6469a52d"

    mkdir -p "$RESULTS_DIR" "$RESULTS_DIR/rl_logs"

    echo "=== Phase 1: Runtime deps ==="
    # torchdata: StatefulDataLoader (same runtime install the PoC's RayCluster
    # init-container does). openai: env-side LLM-judge client (fails fast on the
    # dummy key -> score 0, matching the colocated baseline). Neither touches torch.
    python3 -m pip install --no-cache-dir torchdata openai 2>&1 | tail -2
    python3 -c "import torchdata.stateful_dataloader, openai; print('runtime deps OK')"

    echo "=== Phase 2: Pinned verl clone + pod patches ==="
    if [ ! -d /opt/verl ]; then
        git clone --filter=blob:none https://github.com/volcengine/verl.git /opt/verl
    fi
    git -C /opt/verl fetch origin "$VERL_COMMIT" || git -C /opt/verl fetch origin
    git -C /opt/verl checkout "$VERL_COMMIT"
    # Same live patches deploy_verl.sh applies to worker pods:
    # layered_summon / peft_merge may be missing on DetachActorWorker.
    sed -i 's/layered_summon=self\.layered_summon/layered_summon=getattr(self, "layered_summon", False)/g' \
        /opt/verl/verl/workers/engine_workers.py
    sed -i 's/if not self\.peft_merge/if not getattr(self, "peft_merge", False)/g' \
        /opt/verl/verl/workers/engine_workers.py
    # Make sure the image's preinstalled verl can't shadow the pinned clone.
    python3 -m pip uninstall -y verl 2>/dev/null | tail -1 || true

    echo "=== Phase 3: Assemble timeslice-deepresearch code tree ==="
    # The code ConfigMap uses flat keys with '--' as the path separator
    # (ConfigMap keys cannot contain '/'; '__' would collide with __init__.py).
    rm -rf /opt/timeslice && mkdir -p /opt/timeslice
    for f in /workspace/code/*; do
        name="$(basename "$f")"
        dest="/opt/timeslice/${name//--//}"
        mkdir -p "$(dirname "$dest")"
        cp "$f" "$dest"
    done
    find /opt/timeslice -name "*.py" | wc -l

    echo "=== Phase 4: MHQA question data from pinned CMU repo ==="
    CMU_DIR=/opt/cmu-deepresearch
    if [ ! -d "$CMU_DIR/.git" ]; then
        mkdir -p "$CMU_DIR" && cd "$CMU_DIR"
        git init -q
        git remote add origin https://github.com/cxcscmu/verl-agent-deepresearch.git
        git fetch --depth 1 origin "$CMU_COMMIT"
        git checkout -q FETCH_HEAD
    fi
    DATA_SRC="$CMU_DIR/agent_system/environments/env_package/deepresearch/deepresearch/data/deepresearch_mhqa"
    DATA_DST="/opt/timeslice/agent_system/environments/env_package/deepresearch/deepresearch/data/deepresearch_mhqa"
    mkdir -p "$DATA_DST"
    cp "$DATA_SRC"/*.json "$DATA_DST/"
    ls -la "$DATA_DST"

    echo "=== Phase 5: Download model ==="
    python3 -c "
    from huggingface_hub import snapshot_download
    snapshot_download('Qwen/Qwen2.5-3B-Instruct', local_dir='$MODEL_PATH')
    print('Model download complete')
    "

    echo "=== Phase 6: Wait for search sidecar (:$SEARCH_PORT) ==="
    python3 - << 'PYWAIT'
    import json, time, urllib.request
    url = "http://localhost:8877/search"
    deadline = time.time() + 2400  # 12GB index download on first run
    while time.time() < deadline:
        try:
            req = urllib.request.Request(
                url, data=json.dumps({"q": "capital of France"}).encode(),
                headers={"Content-Type": "application/json"})
            body = urllib.request.urlopen(req, timeout=10).read()
            organic = json.loads(body).get("organic", [])
            print(f"Search server ready, {len(organic)} results for sanity query")
            print(str(body[:300]))
            raise SystemExit(0)
        except SystemExit:
            raise
        except Exception:
            time.sleep(5)
    raise SystemExit("FATAL: search sidecar not ready after 2400s")
    PYWAIT

    echo "=== Phase 7: Prepare parquet (sizing + raw_prompt vehicle) ==="
    python3 /opt/timeslice/prepare_deepresearch_data.py \
        --train_json "$DATA_DST/train.json" \
        --val_json "$DATA_DST/val.json" \
        --out_dir /workspace/data \
        --train_data_size 128 \
        --val_data_size 64

    echo "=== Phase 8: Start GPU monitor (100ms) ==="
    bash /workspace/scripts/gpu_monitor.sh "$RESULTS_DIR/gpu_util.csv" 100 &
    MONITOR_PID=$!
    date +%s%3N > "$RESULTS_DIR/start_ts"

    echo "=== Phase 9: Training ==="
    echo "  Model: Qwen2.5-3B-Instruct | Layout: 1 trainer GPU + 1 sampler GPU (TP=1)"
    echo "  Multi-turn: env.max_steps=6, env_num=8, group_n=4 (32 concurrent envs)"
    echo "  Data: MHQA, train_data_size=128 -> 16 steps"
    nvidia-smi

    export PYTHONUNBUFFERED=1
    export HYDRA_FULL_ERROR=1
    export TIMESLICE_DISABLED=1
    export TIMESLICE_JOB_ID=job-disagg
    export VERL_ROOT=/opt/verl
    export PYTHONPATH="/opt/verl:/opt/timeslice:${PYTHONPATH:-}"
    export SEARCH_URL="http://localhost:$SEARCH_PORT/search"
    export DEEPRESEARCH_TOKENIZER_PATH="$MODEL_PATH"
    export DEEPRESEARCH_LOG_ROOT="$RESULTS_DIR"
    export LOG_DIR="$RESULTS_DIR/rl_logs"
    export OPENAI_API_KEY="dummy-not-used"
    export GOOGLE_API_KEY="dummy-not-used"
    export GEMINI_API_KEY="dummy-not-used"

    # hydra searchpath in one_step_off_ppo_trainer.yaml is CWD-relative
    cd /opt/verl
    python3 /opt/timeslice/main_ppo_timeslice_sync.py \
        data.train_files=/workspace/data/train.parquet \
        data.val_files=/workspace/data/val.parquet \
        data.train_batch_size=8 \
        data.val_batch_size=16 \
        data.max_prompt_length=10000 \
        data.max_response_length=1024 \
        data.return_raw_chat=True \
        data.truncation=left \
        actor_rollout_ref.model.path="$MODEL_PATH" \
        actor_rollout_ref.hybrid_engine=False \
        actor_rollout_ref.actor.strategy=fsdp \
        actor_rollout_ref.model.enable_gradient_checkpointing=True \
        actor_rollout_ref.actor.optim.lr=5e-7 \
        actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0.1 \
        actor_rollout_ref.actor.ppo_mini_batch_size=32 \
        actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2 \
        actor_rollout_ref.actor.use_kl_loss=False \
        actor_rollout_ref.actor.entropy_coeff=0.001 \
        actor_rollout_ref.rollout.name=vllm \
        actor_rollout_ref.rollout.mode=async \
        actor_rollout_ref.rollout.n=1 \
        actor_rollout_ref.rollout.tensor_model_parallel_size=1 \
        actor_rollout_ref.rollout.gpu_memory_utilization=0.8 \
        actor_rollout_ref.rollout.max_model_len=12288 \
        actor_rollout_ref.rollout.max_num_batched_tokens=12288 \
        actor_rollout_ref.rollout.enable_chunked_prefill=True \
        actor_rollout_ref.rollout.temperature=1.0 \
        actor_rollout_ref.rollout.top_p=0.95 \
        actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=4 \
        actor_rollout_ref.rollout.free_cache_engine=False \
        algorithm.adv_estimator=grpo \
        algorithm.rollout_correction.bypass_mode=False \
        trainer.n_gpus_per_node=1 \
        trainer.nnodes=1 \
        rollout.n_gpus_per_node=1 \
        rollout.nnodes=1 \
        trainer.total_epochs=1 \
        trainer.save_freq=-1 \
        trainer.test_freq=-1 \
        trainer.val_before_train=False \
        trainer.logger=console \
        trainer.project_name=disagg-deepresearch \
        trainer.experiment_name=qwen3b-mhqa-disagg \
        +env.env_name=deepresearch \
        +env.dataset=deepresearch_mhqa \
        +env.max_steps=6 \
        +env.rollout.n=4 \
        +env.seed=0 \
        +env.use_explicit_thinking=True \
        +env.is_evaluation=False \
        +env.use_critique=False \
        +env.use_rule_reward=False \
        +env.rule_reward_coef=0 \
        +env.use_dense_reward=False \
        +env.rule_number=5 \
        2>&1 | tee "$RESULTS_DIR/train.log" || {
            echo "WARNING: Training failed"
            date +%s%3N > "$RESULTS_DIR/end_ts"
            kill "$MONITOR_PID" 2>/dev/null || true
            echo "=== Partial results ==="
            wc -l "$RESULTS_DIR/gpu_util.csv" || true
            echo "=== GPU trace dump (gzip+base64, prefix GPUCSV:) ==="
            echo "GPUCSV-BEGIN md5=$(md5sum "$RESULTS_DIR/gpu_util.csv" | cut -d' ' -f1)"
            gzip -c "$RESULTS_DIR/gpu_util.csv" | base64 -w 3000 | sed 's/^/GPUCSV:/' || true
            echo "GPUCSV-END"
            sleep 7200
            exit 1
        }

    date +%s%3N > "$RESULTS_DIR/end_ts"
    kill "$MONITOR_PID" 2>/dev/null || true

    echo "=== Per-GPU summary ==="
    python3 -c "
    import csv
    from collections import defaultdict
    traces = defaultdict(list)
    with open('$RESULTS_DIR/gpu_util.csv') as f:
        for row in csv.DictReader(f):
            traces[int(row['gpu_index'])].append(float(row['gpu_util_pct']))
    for gi in sorted(traces.keys()):
        u = traces[gi]
        n = len(u)
        mean_u = sum(u)/n
        idle = sum(1 for v in u if v <= 15)/n
        busy = sum(1 for v in u if v >= 50)/n
        print(f'GPU {gi}: mean={mean_u:.1f}% idle={idle:.1%} busy={busy:.1%} samples={n}')
    "

    echo "=== Training complete ==="
    echo "GPU trace: $(wc -l < $RESULTS_DIR/gpu_util.csv) samples"

    # Insurance: dump the raw GPU trace to stdout as gzip+base64 so Cloud
    # Logging preserves it even if the live kubectl-cp window is missed.
    echo "=== GPU trace dump (gzip+base64, prefix GPUCSV:) ==="
    echo "GPUCSV-BEGIN md5=$(md5sum "$RESULTS_DIR/gpu_util.csv" | cut -d' ' -f1)"
    gzip -c "$RESULTS_DIR/gpu_util.csv" | base64 -w 3000 | sed 's/^/GPUCSV:/' || true
    echo "GPUCSV-END"

    echo "=== Metrics JSONL dump ==="
    cat "$RESULTS_DIR"/rl_logs/metrics_*.jsonl 2>/dev/null || true

    echo "=== Keeping pod alive for result collection ==="
    sleep 7200

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: disagg-deepresearch-code
  namespace: default
data:
  main_ppo_timeslice_sync.py: |
    """
    main_ppo_timeslice_sync.py
    ===========================
    Sync disaggregated timeslice entry point — deep-research port.

    Seeded from rl-time-slicing/verl/main_ppo_timeslice_sync.py
    (with the latent import bug fixed: verl_timeslice_sync_modular_trainer ->
    verl_timeslice_sync_trainer).

    Uses verl's one_step_off_policy recipe to get separate actor_wg and rollout_wg
    on separate GPUs with NCCL weight sync. Replaces the async training loop with
    a clean sync loop in SyncTimesliceTrainer.

    Deep-research additions (activated when +env.env_name=deepresearch is set):
      - builds the CMU Ray env actors (make_envs) and TrajectoryCollector and
        passes them into SyncTimesliceTrainer -> multi-turn rollout in the
        sampler phase
      - disables the streaming reward loop inside the agent loop workers (the
        per-turn batches carry no reward_model/data_source keys; rewards come
        from the env + EpisodeRewardManager instead)
      - TIMESLICE_* env vars are optional (TIMESLICE_DISABLED=1 runs the pure
        disagg benchmark with no orchestrator)

    Architecture:
      GPU 0: rollout worker (vLLM, server mode) — sampler pool
      GPU 1: actor worker (FSDP)                — trainer pool

    Usage (deep-research):
      python3 main_ppo_timeslice_sync.py \
        actor_rollout_ref.hybrid_engine=False \
        trainer.n_gpus_per_node=1 trainer.nnodes=1 \
        rollout.n_gpus_per_node=1 rollout.nnodes=1 \
        +env.env_name=deepresearch +env.dataset=deepresearch_mhqa \
        +env.max_steps=6 +env.rollout.n=4 ...
    """

    import os
    import sys

    sys.path.insert(0, os.path.dirname(__file__))

    import ray
    import hydra
    from omegaconf import DictConfig, OmegaConf

    from verl_timeslice_sync_trainer import SyncTimesliceTrainer
    from gpu_client import GpuClient


    def _is_deepresearch(config) -> bool:
      try:
        env_cfg = config.get("env", None)
        return bool(env_cfg) and "deepresearch" in str(env_cfg.get("env_name", "")).lower()
      except Exception:
        return False


    @ray.remote(num_cpus=1)
    class SyncTimesliceTaskRunner:
      """TaskRunner for sync disaggregated timeslice training.

      Uses one_step_off_policy's worker setup (separate actor_wg + rollout_wg)
      but replaces the async training loop with SyncTimesliceTrainer.fit().
      """

      def run(self, config):
        import socket

        print(f'[SyncTimesliceTaskRunner] hostname={socket.gethostname()}')

        from verl.utils.fs import copy_to_local
        from verl.utils import hf_tokenizer, hf_processor
        from verl.utils.dataset.rl_dataset import collate_fn
        # moved out of verl.trainer.main_ppo on verl main (pinned a35908ca)
        from verl.trainer.ppo.utils import create_rl_dataset, create_rl_sampler
        from torchdata.stateful_dataloader import StatefulDataLoader

        # Timeslice env vars are optional: with TIMESLICE_DISABLED=1 the GpuClient
        # calls are no-ops and no orchestrator/daemon stack is needed.
        job_id = os.environ.get('TIMESLICE_JOB_ID', 'job-disagg')
        pool_sampler = os.environ.get('TIMESLICE_POOL_SAMPLER', 'sampler')
        pool_trainer = os.environ.get('TIMESLICE_POOL_TRAINER', 'trainer')

        deepresearch_mode = _is_deepresearch(config)

        # ── Model and tokenizer ───────────────────────────────────────────
        local_path = copy_to_local(
            config.actor_rollout_ref.model.path,
            use_shm=config.actor_rollout_ref.model.get('use_shm', False),
        )
        trust_remote_code = config.data.get('trust_remote_code', False)
        tokenizer = hf_tokenizer(local_path, trust_remote_code=trust_remote_code)
        processor = hf_processor(
            local_path, trust_remote_code=trust_remote_code, use_fast=True
        )

        # ── Datasets ──────────────────────────────────────────────────────
        # For deep-research the parquet is only a sizing + raw_prompt/data_source
        # vehicle: the actual questions come from the env's own JSON dataset.
        train_dataset = create_rl_dataset(
            config.data.train_files,
            config.data,
            tokenizer,
            processor,
            is_train=True,
        )
        val_dataset = create_rl_dataset(
            config.data.val_files, config.data, tokenizer, processor, is_train=False
        )
        train_sampler = create_rl_sampler(config.data, train_dataset)

        train_dataloader = StatefulDataLoader(
            dataset=train_dataset,
            batch_size=config.data.train_batch_size,
            sampler=train_sampler,
            collate_fn=collate_fn,
            drop_last=True,
        )
        val_dataloader = StatefulDataLoader(
            dataset=val_dataset,
            batch_size=config.data.val_batch_size or len(val_dataset),
            collate_fn=collate_fn,
            drop_last=False,
        )

        # ── Worker groups (one_step_off_policy setup) ─────────────────────
        from verl.experimental.separation.utils import create_resource_pool_manager, create_role_worker_mapping
        from verl.experimental.one_step_off_policy.ray_trainer import OneStepOffRayTrainer
        from verl.experimental.separation.engine_workers import DetachActorWorker
        from verl.experimental.agent_loop.agent_loop import AgentLoopWorker

        original_detach_init = DetachActorWorker.__init__
        def timeslice_detach_init(self, *args, **kwargs):
          original_detach_init(self, *args, **kwargs)
          from gpu_client import GpuClient
          job_id = os.environ.get('TIMESLICE_JOB_ID', 'job-disagg')
          pool = os.environ.get('TIMESLICE_POOL_TRAINER', 'trainer')
          GpuClient(workload_id=f'{job_id}-{pool}', pool=pool)

        DetachActorWorker.__init__ = timeslice_detach_init

        original_agent_init = AgentLoopWorker.__init__
        def timeslice_agent_init(self, *args, **kwargs):
          original_agent_init(self, *args, **kwargs)
          from gpu_client import GpuClient
          job_id = os.environ.get('TIMESLICE_JOB_ID', 'job-disagg')
          pool = os.environ.get('TIMESLICE_POOL_SAMPLER', 'sampler')
          GpuClient(workload_id=f'{job_id}-{pool}', pool=pool)

        AgentLoopWorker.__init__ = timeslice_agent_init

        if deepresearch_mode:
          # The streaming reward loop scores every generated sample inside the
          # agent loop worker using reward_model/data_source keys that the CMU
          # per-turn batches do not carry (rewards come from the env instead),
          # and — worse — when it is enabled the agent loop does NOT propagate
          # input non-tensor fields back into the output batch. Force the
          # AgentLoopManager to be built without reward loop handles.
          original_init_mgr = OneStepOffRayTrainer._init_async_rollout_manager

          def patched_init_mgr(trainer_self):
            class _NoRewardLoop:
              reward_loop_workers = None

            real_manager = trainer_self.reward_loop_manager
            trainer_self.reward_loop_manager = _NoRewardLoop()
            try:
              original_init_mgr(trainer_self)
            finally:
              trainer_self.reward_loop_manager = real_manager

          OneStepOffRayTrainer._init_async_rollout_manager = patched_init_mgr

        config.actor_rollout_ref.rollout.nnodes = 1
        config.actor_rollout_ref.rollout.n_gpus_per_node = 1

        role_worker_mapping, ray_worker_group_cls = create_role_worker_mapping(config)
        resource_pool_manager = create_resource_pool_manager(config, role_worker_mapping.keys())

        # Register the workload shell from the Head Actor before workers boot up
        GpuClient(workload_id=f'{job_id}-trainer', pool=pool_trainer).register(pids=[])
        GpuClient(workload_id=f'{job_id}-sampler', pool=pool_sampler).register(pids=[])

        one_step_trainer = OneStepOffRayTrainer(
            config=config,
            tokenizer=tokenizer,
            processor=processor,
            role_worker_mapping=role_worker_mapping,
            resource_pool_manager=resource_pool_manager,
            ray_worker_group_cls=ray_worker_group_cls,
            train_dataset=train_dataset,
            val_dataset=val_dataset,
            collate_fn=collate_fn,
            train_sampler=train_sampler,
            device_name=config.trainer.device,
        )

        # Initialize workers under BOTH locks to prevent arbitrary VRAM collisions
        # during Ray Actor startup (since vLLM allocates VRAM eagerly).
        gpu_trainer = GpuClient(workload_id=f'{job_id}-trainer', pool=pool_trainer)
        gpu_sampler = GpuClient(workload_id=f'{job_id}-sampler', pool=pool_sampler)
        gpu_trainer.acquire_gpu()
        gpu_sampler.acquire_gpu()
        try:
          one_step_trainer.init_workers()
          # SHORTCUT FOR VERL POC: Now that vLLM and FSDP have spawned on the GPUs,
          # let the node daemon crawl the host to resolve PIDs (no-op when disabled).
          gpu_trainer.update_pids(pids=['bypass_pod_logic'])
          gpu_sampler.update_pids(pids=['bypass_pod_logic'])
        except Exception as e:
          # Only yield if initialization spectacularly crashes
          gpu_trainer.yield_gpu()
          gpu_sampler.yield_gpu()
          raise e

