apiVersion: v1
kind: ConfigMap
metadata:
  name: disagg-sync-scripts-iter2
  namespace: default
data:
  gpu_monitor.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    OUTPUT="${1:?Usage: $0 <output.csv> [interval_ms]}"
    INTERVAL_MS="${2:-100}"
    echo "timestamp_ms,gpu_index,gpu_util_pct,mem_util_pct,power_w" > "$OUTPUT"
    trap 'exit 0' SIGINT SIGTERM
    SLEEP_S=$(python3 -c "print($INTERVAL_MS/1000)")
    while true; do
        ts=$(date +%s%3N)
        nvidia-smi --query-gpu=index,utilization.gpu,utilization.memory,power.draw \
                   --format=csv,noheader,nounits 2>/dev/null | \
        while IFS=', ' read -r idx gpu mem pwr; do
            echo "${ts},${idx},${gpu},${mem},${pwr}"
        done >> "$OUTPUT"
        sleep "$SLEEP_S"
    done

  run_disagg_sync.sh: |
    #!/usr/bin/env bash
    set -xeuo pipefail

    RESULTS_DIR="/workspace/results"
    MODEL_PATH="/workspace/models/Qwen2.5-0.5B-Instruct"
    TRAIN_FILE="/workspace/data/dapo_math_17k/train.parquet"
    VAL_FILE="/workspace/data/aime_2024/val.parquet"

    mkdir -p "$RESULTS_DIR" /workspace/data/dapo_math_17k /workspace/data/aime_2024

    echo "=== Setting up environment ==="
    pip install datasets TransferQueue 2>&1 | tail -5

    git clone --depth 1 https://github.com/verl-project/verl.git /workspace/verl-src
    cd /workspace/verl-src
    pip install -e ".[gpu]" 2>&1 | tail -10
    cd /workspace

    pip install cupy-cuda12x 2>&1 | tail -3
    python3 -c "import verl; print('verl version:', verl.__version__)" 2>&1
    python3 -c "import transfer_queue; print('transfer_queue OK')" 2>&1
    echo "=== Install complete ==="

    echo "=== Downloading model: Qwen2.5-0.5B-Instruct ==="
    python3 -c "
    from huggingface_hub import snapshot_download
    snapshot_download('Qwen/Qwen2.5-0.5B-Instruct', local_dir='$MODEL_PATH')
    print('Model download complete')
    "

    echo "=== Downloading datasets ==="
    python3 << 'PYEOF'
    import json
    from datasets import load_dataset

    print("Downloading DAPO-Math-17k...")
    ds = load_dataset("BytedTsinghua-SIA/DAPO-Math-17k", split="train")
    def prep_train(example):
        return {"prompt": json.dumps(example["prompt"])}
    ds = ds.map(prep_train)
    ds.to_parquet("/workspace/data/dapo_math_17k/train.parquet")
    print(f"DAPO-Math-17k: {len(ds)} samples, columns: {ds.column_names}")

    print("Downloading AIME-2024...")
    ds_val = load_dataset("BytedTsinghua-SIA/AIME-2024", split="train")
    def prep_val(example):
        return {"prompt": json.dumps(example["prompt"])}
    ds_val = ds_val.map(prep_val)
    ds_val.to_parquet("/workspace/data/aime_2024/val.parquet")
    print(f"AIME-2024: {len(ds_val)} samples, columns: {ds_val.column_names}")
    PYEOF

    echo "=== Starting GPU monitor ==="
    bash /workspace/scripts/gpu_monitor.sh "$RESULTS_DIR/gpu_util.csv" 100 &
    MONITOR_PID=$!

    date +%s%3N > "$RESULTS_DIR/start_ts"

    echo "=== Iteration 2: require=32, gpu_mem=0.5, epochs=2, mini=128, sync=4 ==="
    nvidia-smi

    TOTAL_ROLLOUT_STEPS=65536

    python3 -m verl.experimental.fully_async_policy.fully_async_main \
        data.train_files="$TRAIN_FILE" \
        data.val_files="$VAL_FILE" \
        data.prompt_key=prompt \
        data.truncation=left \
        data.max_prompt_length=2048 \
        data.max_response_length=4096 \
        data.train_batch_size=0 \
        data.gen_batch_size=1 \
        data.return_raw_chat=True \
        actor_rollout_ref.model.path="$MODEL_PATH" \
        actor_rollout_ref.model.use_remove_padding=True \
        actor_rollout_ref.model.enable_gradient_checkpointing=True \
        actor_rollout_ref.hybrid_engine=False \
        actor_rollout_ref.actor.strategy=fsdp \
        actor_rollout_ref.actor.ppo_mini_batch_size=128 \
        actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1 \
        actor_rollout_ref.actor.ppo_epochs=2 \
        actor_rollout_ref.actor.use_kl_loss=False \
        actor_rollout_ref.actor.kl_loss_coef=0.0 \
        actor_rollout_ref.actor.entropy_coeff=0 \
        actor_rollout_ref.actor.clip_ratio_low=0.2 \
        actor_rollout_ref.actor.clip_ratio_high=0.28 \
        actor_rollout_ref.actor.clip_ratio_c=10.0 \
        actor_rollout_ref.actor.grad_clip=1.0 \
        actor_rollout_ref.actor.loss_agg_mode=token-mean \
        actor_rollout_ref.actor.use_dynamic_bsz=True \
        actor_rollout_ref.actor.optim.lr=1e-6 \
        actor_rollout_ref.actor.optim.lr_warmup_steps=-1 \
        actor_rollout_ref.actor.optim.weight_decay=0.1 \
        actor_rollout_ref.actor.fsdp_config.param_offload=False \
        actor_rollout_ref.actor.fsdp_config.optimizer_offload=False \
        actor_rollout_ref.ref.log_prob_use_dynamic_bsz=True \
        actor_rollout_ref.ref.fsdp_config.param_offload=False \
        actor_rollout_ref.rollout.n=16 \
        actor_rollout_ref.rollout.calculate_log_probs=True \
        actor_rollout_ref.rollout.name=vllm \
        actor_rollout_ref.rollout.mode=async \
        actor_rollout_ref.rollout.checkpoint_engine.backend=nccl \
        actor_rollout_ref.rollout.gpu_memory_utilization=0.25 \
        actor_rollout_ref.rollout.tensor_model_parallel_size=1 \
        actor_rollout_ref.rollout.enable_chunked_prefill=True \
        actor_rollout_ref.rollout.temperature=1.0 \
        actor_rollout_ref.rollout.top_p=1.0 \
        actor_rollout_ref.rollout.top_k=-1 \
        algorithm.adv_estimator=grpo \
        algorithm.use_kl_in_reward=False \
        algorithm.kl_ctrl.kl_coef=0.0 \
        reward.reward_manager.name=dapo \
        +reward.reward_kwargs.overlong_buffer_cfg.enable=True \
        +reward.reward_kwargs.overlong_buffer_cfg.len=512 \
        +reward.reward_kwargs.overlong_buffer_cfg.penalty_factor=1.0 \
        +reward.reward_kwargs.overlong_buffer_cfg.log=True \
        +reward.reward_kwargs.max_resp_len=4096 \
        trainer.logger="['console']" \
        trainer.val_before_train=False \
        trainer.save_freq=-1 \
        trainer.resume_mode=disable \
        trainer.nnodes=1 \
        trainer.n_gpus_per_node=1 \
        trainer.total_epochs=1 \
        trainer.test_freq=-1 \
        trainer.project_name=disagg-sync-iter2 \
        trainer.experiment_name=qwen05b-require32-gpumem05 \
        trainer.default_local_dir="$RESULTS_DIR/ckpts" \
        rollout.nnodes=1 \
        rollout.n_gpus_per_node=1 \
        rollout.total_rollout_steps="$TOTAL_ROLLOUT_STEPS" \
        async_training.staleness_threshold=0 \
        async_training.trigger_parameter_sync_step=4 \
        async_training.partial_rollout=False \
        async_training.require_batches=32 \
        2>&1 | tee "$RESULTS_DIR/train.log" || {
            echo "WARNING: Training failed"
            date +%s%3N > "$RESULTS_DIR/end_ts"
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
            wc -l "$RESULTS_DIR/gpu_util.csv" || true
            exit 1
        }

    date +%s%3N > "$RESULTS_DIR/end_ts"
    kill "$MONITOR_PID" 2>/dev/null || true
    wait "$MONITOR_PID" 2>/dev/null || true
    echo "=== Complete ==="
    wc -l "$RESULTS_DIR/gpu_util.csv"

    echo "=== Per-GPU summary ==="
    python3 -c "
    import csv
    from collections import defaultdict
    traces = defaultdict(list)
    with open('$RESULTS_DIR/gpu_util.csv') as f:
        for row in csv.DictReader(f):
            traces[int(row['gpu_index'])].append(float(row['gpu_util_pct']))
    for gi in sorted(traces.keys()):
        u = traces[gi]
        n = len(u)
        mean_u = sum(u)/n
        idle = sum(1 for v in u if v <= 15)/n
        busy = sum(1 for v in u if v >= 50)/n
        print(f'GPU {gi}: mean={mean_u:.1f}% idle={idle:.1%} busy={busy:.1%} samples={n}')
    "

    echo "=== Keeping pod alive for result collection ==="
    sleep 3600
---
apiVersion: batch/v1
kind: Job
metadata:
  name: disagg-sync-iter2
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: disagg-sync-iter2
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-80gb
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - gke-verl-research-clus-h100-2gpu-spot-8cf82ce9-5wn5
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: benchmark
        image: verlai/verl:vllm020.dev2
        env:
        - name: VLLM_USE_V1
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo "=== Disagg Sync Iteration 2 ==="
          echo "Node: $(hostname)"
          nvidia-smi
          cp /workspace/scripts/gpu_monitor.sh /usr/local/bin/gpu_monitor.sh
          chmod +x /usr/local/bin/gpu_monitor.sh
          bash /workspace/scripts/run_disagg_sync.sh 2>&1 | tee /workspace/results/experiment.log
        resources:
          limits:
            nvidia.com/gpu: 2
          requests:
            nvidia.com/gpu: 2
            cpu: "48"
            memory: "200Gi"
        volumeMounts:
        - name: scripts
          mountPath: /workspace/scripts
        - name: results
          mountPath: /workspace/results
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: scripts
        configMap:
          name: disagg-sync-scripts-iter2
          defaultMode: 0755
      - name: results
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
