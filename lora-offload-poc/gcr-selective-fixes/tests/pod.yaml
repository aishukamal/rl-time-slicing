apiVersion: v1
kind: Pod
metadata:
  name: gcr-seltest
  labels:
    app: gcr-seltest
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: h100-2gpu-pool
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  containers:
  - name: dev
    image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
    command: ["sleep", "infinity"]
    env:
    - name: EXPORT_FILE_PATH
      value: /ckpt
    resources:
      limits:
        nvidia.com/gpu: 1
    volumeMounts:
    - name: ckpt
      mountPath: /ckpt
    - name: work
      mountPath: /work
  volumes:
  - name: ckpt
    emptyDir: {}
  - name: work
    emptyDir: {}
