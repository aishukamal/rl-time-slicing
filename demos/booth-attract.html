const PAL = {blue:"#4285F4", green:"#188038", red:"#EA4335", yellow:"#F29900",

const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage");
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  (parent||stage).appendChild(e);
  return e;
}
function txt(parent, x, y, str, size, fill, opts){
  opts = opts || {};
  const e = el("text", {x, y, "font-size":size, fill, class:"svgtxt",
    "text-anchor": opts.anchor||"start", "font-weight": opts.weight||400,
    opacity: opts.opacity==null?1:opts.opacity}, parent);
  e.textContent = str;
  return e;
}
function rrect(parent, x,y,w,h, r, fill, opts){
  opts=opts||{};
  const e = el("rect",{x,y,width:Math.max(0,w),height:Math.max(0,h),rx:r,ry:r,fill,
    opacity:opts.opacity==null?1:opts.opacity},parent);
  if (opts.stroke){ e.setAttribute("stroke",opts.stroke); e.setAttribute("stroke-width",opts.sw||2); }
  return e;
}
const clamp01 = v => v<0?0:v>1?1:v;
const lerp = (a,b,t) => a+(b-a)*t;
const fade = (n,o) => n.setAttribute("opacity", clamp01(o));

  txt(g, cfg.x, cfg.y+8, cfg.labelB || "baseline", 15, PAL.ink3);

  const fb = rrect(g, cfg.x, cfg.y+16, 0, H, 7, PAL.gray);
  const tb = txt(g, cfg.x, cfg.y+29, "", 16, PAL.ink3, {weight:600});
  txt(g, cfg.x, cfg.y+62, cfg.labelT || "time-sliced", 15, PAL.ink2);
  rrect(g, cfg.x, cfg.y+70, W, H, 7, PAL.hair);
  const fe = rrect(g, cfg.x, cfg.y+70, 0, H, 7, cfg.color);
  const te = txt(g, cfg.x, cfg.y+83, "", 16, PAL.ink, {weight:700});

      te.textContent = vE.toFixed(1)+"%"; te.setAttribute("x", cfg.x+W*clamp01(vE/100)+9);
    } else { tb.textContent = ""; te.textContent = ""; }
  }};
}
// active seconds of [a,b) interval list before clock position t
function actIn(segs, t){
  let a = 0;
  for (const q of segs){ const q0 = q[0], q1 = q[1];
    if (t <= q0) break; a += Math.min(t, q1) - q0; }
  return a;
}
function convMini(g, cfg){
  const x0 = cfg.xs[0], x1 = cfg.xs[cfg.xs.length-1];
  const X = v => cfg.x + (v-x0)/(x1-x0)*cfg.w;
  const Y = r => cfg.y + (1-(r-cfg.ylo)/(cfg.yhi-cfg.ylo))*cfg.h;
  const ydp = cfg.ydp==null ? 1 : cfg.ydp;   // y-tick decimals (rev U: pass@4 needs 2)
  txt(g, cfg.x, cfg.y-16, cfg.title || "CONVERGENCE — SAME REWARD BAND", 15, PAL.ink3, {weight:700});
  txt(g, cfg.x+8, cfg.y+16, cfg.ylab || "reward", 13, PAL.ink3);
  el("line",{x1:cfg.x,y1:cfg.y,x2:cfg.x,y2:cfg.y+cfg.h,stroke:PAL.hair,"stroke-width":1.5},g);
  el("line",{x1:cfg.x,y1:cfg.y+cfg.h,x2:cfg.x+cfg.w,y2:cfg.y+cfg.h,stroke:PAL.hair,"stroke-width":1.5},g);
  if (cfg.ylo<0 && cfg.yhi>0){
    el("line",{x1:cfg.x,y1:Y(0),x2:cfg.x+cfg.w,y2:Y(0),stroke:PAL.hair,"stroke-width":1},g);
    txt(g, cfg.x-8, Y(0)+5, "0", 13, PAL.ink3, {anchor:"end"});
  }
  txt(g, cfg.x-8, Y(cfg.yhi)+5, cfg.yhi.toFixed(ydp), 13, PAL.ink3, {anchor:"end"});
  txt(g, cfg.x-8, Y(cfg.ylo)+5, cfg.ylo.toFixed(ydp), 13, PAL.ink3, {anchor:"end"});
  txt(g, cfg.x+cfg.w, cfg.y+cfg.h+38, cfg.xlabel, 14, PAL.ink3, {anchor:"end"});
  [x0, cfg.xs[Math.floor(cfg.xs.length/2)], x1].forEach(v=>{
    el("line",{x1:X(v),y1:cfg.y+cfg.h,x2:X(v),y2:cfg.y+cfg.h+5,stroke:PAL.ink3},g);
    txt(g, X(v), cfg.y+cfg.h+20, String(v), 13, PAL.ink3, {anchor:"middle"});
  });
  const S = cfg.series.map(sr=>({sr,
    line: el("polyline",{fill:"none",stroke:sr.color,"stroke-width":sr.width||4,
      "stroke-linejoin":"round","stroke-linecap":"round"},g),
    lbl: txt(g, 0, 0, sr.label, 14, sr.color, {weight:700, opacity:0})}));
  return {set(ns){                    // ns[i] = points revealed (float) per series
    S.forEach((o,si)=>{
      const n = ns[si], vals = o.sr.vals, pts = [];
      const full = Math.min(vals.length, Math.floor(n));
      for (let i=0;i<full;i++) pts.push([X(cfg.xs[i]), Y(vals[i])]);
      const f = n - Math.floor(n);
      if (full>=1 && full<vals.length && f>0)
        pts.push([lerp(X(cfg.xs[full-1]),X(cfg.xs[full]),f),
                  lerp(Y(vals[full-1]),Y(vals[full]),f)]);
      o.line.setAttribute("points", pts.map(q=>q.join(",")).join(" "));
      if (pts.length){ const last = pts[pts.length-1];
        o.lbl.setAttribute("x", last[0]+10);
        o.lbl.setAttribute("y", last[1]+5+(o.sr.dy||0)); fade(o.lbl,1);
      } else fade(o.lbl,0);
    });
  }};
}

  fade(c1.stat, clamp01((p-STAT_AT)/0.05));
};

CH[2].draw = p => {
  const c2 = CH[2].st, E = D.elastic, EV = D.elastic_flavor2;
  const frac = clamp01(p/STAT_AT);
  // ONE stage clock; each column replays its own wall at its own px/s
  const tauL = frac * E.totals.base_s;
  const tauR = frac * EV.strips.baseline.total_s;
  const setCov = (cv, x0, xs, t) => {
    const wx = t*xs;
    cv.setAttribute("x", x0+wx);
    cv.setAttribute("width", Math.max(0, c2.SW+26-wx));
  };
  const LB = E.totals.base_s, LE = E.totals.elastic_s;
  const RB = EV.strips.baseline.total_s, RE = EV.strips.elastic.total_s;
  setCov(c2.covLA, c2.LX, c2.xsL, Math.min(tauL, LB));
  setCov(c2.covLB, c2.LX, c2.xsL, Math.min(tauL, LE));
  setCov(c2.covRA, c2.RX, c2.xsR, Math.min(tauR, RB));
  setCov(c2.covRB, c2.RX, c2.xsR, Math.min(tauR, RE));
  fade(c2.doneL, tauL>=LE?1:0);
  fade(c2.doneR, tauR>=RE?1:0);
  // ---- companions on the SAME clock ---------------------------------------
  const tBL = Math.min(tauL, LB), tEL = Math.min(tauL, LE);
  const dBL = tauL>=LB ? E.duty_strip.baseline_pct
            : (tBL>60 ? actIn(c2.workB,tBL)/tBL*100 : 0);
  const dEL = tauL>=LE ? E.duty_strip.elastic_pct
            : (tEL>60 ? actIn(c2.workE,tEL)/tEL*100 : 0);
  c2.dutyL.set(dBL, dEL, tauL>60);
  const tBR = Math.min(tauR, RB), tER = Math.min(tauR, RE);
  const dBR = tauR>=RB ? EV.duty_strip.baseline_pct
            : (tBR>600 ? actIn(c2.f2wB,tBR)/tBR*100 : 0);
  const dER = tauR>=RE ? EV.duty_strip.elastic_pct
            : (tER>600 ? actIn(c2.f2wE,tER)/tER*100 : 0);
  c2.dutyR.set(dBR, dER, tauR>600);
  const reveal = (cum, t) => { let i=0;
    while (i<cum.length && cum[i]<=t) i++;
    if (i>=cum.length) return cum.length;
    const lo = i>0 ? cum[i-1] : 0;
    return i + clamp01((t-lo)/(cum[i]-lo)); };
  c2.convL.set([reveal(c2.cumB, tBL), reveal(c2.cumE, tEL)]);
  c2.convR.set([reveal(c2.f2cumB, tBR), reveal(c2.f2cumE, tER)]);
  fade(c2.stat, clamp01((p-STAT_AT)/0.05));
};

  // (fill-frame note line removed 2026-09-16 revision V, user edit — the
  // stat frame's use-case line now carries the walls-unchanged message)
  // stat frame (2026-09-16 user edit, revision O): the THREE results carry
  // EQUAL visual weight — one row of three tiles, same type size/style, no
  // single hero number. Values render from the receipts fields directly.
  // Tile 3 (revision T, coordinator vocabulary decision): the SAME strip-
  // derived duty basis as the live companion — rounded 40% → 97% (exact
  // 39.9/97.2 in D; rounding build-asserted); the nvidia-smi 33.2 → 88.8
  // pair moved entirely to D as the hardware-counter basis note.
  const f = el("g",{opacity:0},g);
  rrect(f, 0, 112, 1600, 648, 0, PAL.surface, {opacity:0.94});
  [[B.totals.items.toLocaleString("en-US"), "requests completed free"],
   [(B.totals.tokens/1e6).toFixed(1)+"M", "tokens generated free"],
   [Math.round(B.occupancy.baseline_pct)+"% → "+Math.round(B.occupancy.interleaved_pct)+"%",
    "trainer GPU duty"]].forEach(([big,cap],i)=>{
    const cx = 320 + i*480;
    txt(f, cx, 420, big, 88, PAL.ink, {anchor:"middle", weight:800});
    txt(f, cx, 466, cap, 26, PAL.ink2, {anchor:"middle"});
  });
  // use-case line (2026-09-16 revision V, user's sentence VERBATIM; 40 px so
  // the longer line keeps side margins at 1600 wide)
  txt(f, 800, 600, "An independent batch inference tenant runs free and RL remains unchanged",
      40, PAL.purple, {anchor:"middle", weight:800});
  c3.stat = f;
  // redraw the second spec line above the stat-frame cover (two-line spec)
  const spec2c = CH[1].spec.split("\n")[1];
  if (spec2c) txt(c3.stat, 800, 128, spec2c, 19, PAL.ink3, {anchor:"middle", weight:600});
  CH[1].st = c3;
}
CH[1].draw = p => {
  const c3 = CH[1].st, B = D.batch;
  const k = clamp01(p/(STAT_AT-0.04)) * c3.wins.length;   // windows filled in turn
  if (c3.pending){
    c3.wins.forEach((W,i)=>{
      const f = clamp01(k-i);
      W.fill.setAttribute("width", Math.max(0, (W.ww-1.4)*f));
      fade(W.lbl, f>=1?1:0);
    });
    fade(c3.stat, clamp01((p-STAT_AT)/0.05));
    return;
  }
  // run-clock position (shared by the cover, the purple fills AND the
  // companions — one clock): windows convert in run order; k maps onto the
  // wall by sweeping through the burst before each window, then the window
  // itself. Slot 0 starts at wall 0 (revision Q) so the prologue + first
  // burst draw in instead of pre-rendering; slots 1+ are unchanged (the
  // asserted mid/end companion values are untouched).
  const done = k >= c3.wins.length;
  const kj = Math.floor(k), kg = k - kj;
  const p0 = kj>=1 ? c3.wins[kj-1].w.b : 0;
  const p1 = kj < c3.wins.length ? c3.wins[kj].w.b : B.strip.total_wall_s;
  const tW = done ? B.strip.total_wall_s : lerp(p0, p1, kg);
  // progressive covers: drawn extent == clock position (Ch3 technique);
  // both lanes share the one clock (revision S)
  const wx = Math.min(tW, B.strip.total_wall_s)*c3.xs;
  [c3.coverA, c3.coverB].forEach(cv=>{
    cv.setAttribute("x", c3.S.x+wx);
    cv.setAttribute("width", Math.max(0, c3.S.w+40-wx));
  });
  let items = 0, toks = 0;
  c3.wins.forEach((W,i)=>{
    // purple fill tracks the cover edge: the window converts exactly as the
    // clock crosses it (receipts 1:1 — walls never shrink)
    const rev = clamp01((tW - W.w.a)/(W.w.b - W.w.a));
    W.fill.setAttribute("width", W.ww*rev);
    if (k-i>=1){ items += W.w.batch.items; toks += W.w.batch.tokens; }
  });
  // ---- companions on the SAME clock (window conversions) -------------------
  const oB = done ? B.occupancy.baseline_pct
           : (tW>120 ? actIn(c3.bSegs, tW)/tW*100 : 0);
  const oT = done ? B.occupancy.interleaved_pct
           : (tW>120 ? (actIn(c3.bSegs, tW)+actIn(c3.wSegs, tW))/tW*100 : 0);
  c3.duty.set(oB, oT, tW>120);
  const AS = c3.wins.map(W=>W.w.after_step);
  const vPrev = kj>=1 ? AS[kj-1] : 0;
  const vNext = kj < AS.length ? AS[kj] : AS[AS.length-1];
  const vlim = done ? 99 : lerp(vPrev, vNext, kg);
  const n = Math.max(0, Math.min(B.convergence.versions.length, vlim - 1));
  c3.conv.set([n, n]);
  if (items>0){
    c3.counter.textContent =
      `${items.toLocaleString("en-US")} requests completed free · ${(toks/1e6).toFixed(1)}M tokens`;
    fade(c3.counter,1);
  } else fade(c3.counter,0);
  fade(c3.stat, clamp01((p-STAT_AT)/0.05));
};

// ------------------------------------------------------------------ player --
const builders=[buildSweep,buildBatch,buildElastic];   // = chapter order
let t=0, playing=true, last=null;
function render(){
  let acc=0, i=0, p=0;
  for (let j=0;j<CH.length;j++){
    if (t<acc+CH[j].dur || j===CH.length-1){ i=j; p=clamp01((t-acc)/CH[j].dur); break; }
    acc+=CH[j].dur;
  }
  CH.forEach((c,j)=>{
    if (j===i && !c.built){ builders[j](); c.built=true; }
    c.g.setAttribute("opacity", j===i?1:0);
  });
  CH[i].draw(p);
}
function frame(now){
  if (last==null) last=now;
  const dt=(now-last)/1000; last=now;
  if (playing){ t += dt; if (t>=TOTAL) t=0; }
  render();
  requestAnimationFrame(frame);
}
(function(){
  const m = location.hash.match(/ch=(\d)(?:,p=([\d.]+))?/);
  if (m){
    const i = Math.min(2, Math.max(0, parseInt(m[1],10)-1));
    let acc=0; for (let j=0;j<i;j++) acc+=CH[j].dur;
    t = acc + (m[2]!=null?parseFloat(m[2]):0.5)*CH[i].dur;
    playing=false;
  }
})();
requestAnimationFrame(frame);

// (the rotating receipts ticker was retired in revision X — the bottom bar is
// now the static repo banner in the markup above; the ticker's receipt items
// live verbatim in BOOTH-NOTES.md "Presenter reference".)

// ---- review controls (2026-09-16 revision S, user request) -----------------
// SPACE toggles pause/resume of the loop clock (everything is a pure function
// of t, so strips, companions, counters and chapter transitions all freeze in
// place; the bottom banner is static — nothing to pause there). LEFT/RIGHT step
// the existing frame grid while paused — the 9 shoot-state boundaries
// (p = 0.25 / 0.4 / 0.8 per chapter). Keyboard-only, no on-screen buttons;
// the corner badge renders ONLY on user pause (deep-link screenshot states
// stay clean; #pause simulates a user pause for the verification shot).
(function(){
  const FR = [];
  CH.forEach((c,i)=>[0.25,0.4,0.8].forEach(p=>FR.push({i,p})));
  const frT = f => { let a=0; for (let j=0;j<f.i;j++) a+=CH[j].dur;
                     return a + f.p*CH[f.i].dur; };
  const badge = document.createElement("div");
  badge.id = "pausebadge";
  document.body.appendChild(badge);
  let showBadge = false;
  function sync(){
    if (playing || !showBadge){ badge.style.display = "none"; return; }
    let acc=0, i=0, p=0;
    for (let j=0;j<CH.length;j++){
      if (t<acc+CH[j].dur || j===CH.length-1){ i=j; p=(t-acc)/CH[j].dur; break; }
      acc+=CH[j].dur;
    }
    const near = FR.findIndex(f=>f.i===i && Math.abs(f.p-p)<0.005);
    badge.textContent = "⏸ paused — ch"+(i+1)+" · p="+p.toFixed(2)
      + (near>=0 ? " · frame "+(near+1)+"/"+FR.length : "")
      + "   (space: play · ←/→: step)";
    badge.style.display = "block";
  }
  document.addEventListener("keydown", e=>{
    if (e.key===" "){
      e.preventDefault();
      playing = !playing; showBadge = !playing; sync();
    } else if ((e.key==="ArrowRight" || e.key==="ArrowLeft") && !playing){
      e.preventDefault();
      const ts = FR.map(frT), eps = 0.05;
      if (e.key==="ArrowRight"){
        const nt = ts.find(v=>v>t+eps);
        t = nt==null ? ts[0] : nt;
      } else {
        const prev = ts.filter(v=>v<t-eps);
        t = prev.length ? prev[prev.length-1] : ts[ts.length-1];
      }
      showBadge = true; sync();
    }
  });
  if (/pause/.test(location.hash)){ playing = false; showBadge = true; }
  sync();
})();

// (the press-D data table was retired in revision X — full provenance lives
// in BOOTH-NOTES.md "Presenter reference — full data provenance")
