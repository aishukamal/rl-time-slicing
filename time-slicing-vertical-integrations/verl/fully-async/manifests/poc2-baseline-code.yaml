# POC2 — BASELINE solo code-RLVR job (lr=1e-6). Runs ALONE on its own node.
# Derived from poc2-job-timeslice-b.yaml (same code-RLVR workload) with baseline
# semantics: solo, every lock acquire is granted immediately, no peer waiting.
# Template variables (render with: envsubst '${NODE_NAME} ${RUN_SECONDS}'):
#   ${NODE_NAME}    the second h100-mega-8gpu-spot-b node for the baseline
#   ${RUN_SECONDS}  training budget passed to `timeout`
#
# Topology: GPU mask "2,0" — trainer on node GPU 2, rollout on node GPU 0.
# Same privileged treatment as timeslice jobs for fair comparison and metrics parity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: poc2-baseline-code
  namespace: default
data:
  gpu_monitor.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    OUTPUT="${1:?Usage: $0 <output.csv> [interval_ms]}"
    INTERVAL_MS="${2:-100}"
    echo "timestamp_ms,gpu_index,gpu_util_pct,mem_util_pct,power_w" > "$OUTPUT"
    trap 'exit 0' SIGINT SIGTERM
    SLEEP_S=$(python3 -c "print($INTERVAL_MS/1000)")
    while true; do
        ts=$(date +%s%3N)
        nvidia-smi --query-gpu=index,utilization.gpu,utilization.memory,power.draw \
                   --format=csv,noheader,nounits 2>/dev/null | \
        while IFS=', ' read -r idx gpu mem pwr; do
            echo "${ts},${idx},${gpu},${mem},${pwr}"
        done >> "$OUTPUT"
        sleep "$SLEEP_S"
    done

  data_prep.py: |
    #!/usr/bin/env python3
    """Prepare the Eurus-2-RL-Data CODE subset for the async code-RLVR experiment.

    Source: HF dataset PRIME-RL/Eurus-2-RL-Data (train.parquet), ALREADY in verl
    RLHFDataset format:
      - data_source in {codecontests, apps, codeforces, taco} -> default reward routing
        hits verl.utils.reward_score.prime_code.compute_score (local in-pod test-case
        execution; extracts the LAST ```python fenced block)
      - prompt = [{system (Eurus action protocol)}, {user: problem + "Write Python code
        ... ```python ... ``` at the end"}]
      - reward_model = {"style": "rule", "ground_truth": '{"inputs": [...], "outputs": [...]}'}

    Transformations:
      1. keep only ability == "code" rows with a data_source that routes to prime_code
      2. DROP the Eurus system message
      3. truncate test suites to first 8 in/out pairs
      4. filter to prompts <= --max_prompt_tokens under the actual chat template
      5. subsample 512 train / 64 val, disjoint, dedup'd on user text
    """

    import argparse
    import json
    import os

    import pandas as pd
    from huggingface_hub import hf_hub_download

    CODE_SOURCES = {"codecontests", "apps", "codeforces", "taco"}


    def truncate_ground_truth(gt_str, max_tests, max_bytes):
        try:
            gt = json.loads(gt_str)
        except Exception:
            return None
        if not isinstance(gt, dict):
            return None
        ins, outs = gt.get("inputs"), gt.get("outputs")
        if not isinstance(ins, list) or not isinstance(outs, list):
            return None
        n = min(len(ins), len(outs), max_tests)
        if n < 1:
            return None
        new_gt = {"inputs": ins[:n], "outputs": outs[:n]}
        if gt.get("fn_name"):
            new_gt["fn_name"] = gt["fn_name"]
        try:
            s = json.dumps(new_gt)
        except Exception:
            return None
        if len(s) > max_bytes:
            return None
        return s


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--repo_id", default="PRIME-RL/Eurus-2-RL-Data")
        ap.add_argument("--filename", default="train.parquet")
        ap.add_argument("--tokenizer", required=True)
        ap.add_argument("--out_dir", default="/workspace/data/eurus_code")
        ap.add_argument("--train_size", type=int, default=512)
        ap.add_argument("--val_size", type=int, default=64)
        ap.add_argument("--max_tests", type=int, default=8)
        ap.add_argument("--max_gt_bytes", type=int, default=200000)
        ap.add_argument("--max_prompt_tokens", type=int, default=1900)
        ap.add_argument("--candidates", type=int, default=3000)
        ap.add_argument("--seed", type=int, default=17)
        args = ap.parse_args()

        local = hf_hub_download(repo_id=args.repo_id, filename=args.filename, repo_type="dataset")
        df = pd.read_parquet(local)
        print(f"loaded {len(df)} rows, columns: {list(df.columns)}")

        df = df[df["ability"] == "code"].reset_index(drop=True)
        print(f"{len(df)} code rows; data_source counts:\n{df['data_source'].value_counts()}")
        df = df[df["data_source"].isin(CODE_SOURCES)].reset_index(drop=True)
        print(f"{len(df)} rows with prime_code-routable data_source")

        rows = []
        n_bad_gt, n_bad_prompt = 0, 0
        for _, r in df.iterrows():
            msgs = [dict(m) for m in r["prompt"]]
            user = [m for m in msgs if m.get("role") == "user"]
            if len(user) != 1 or "```python" not in user[0].get("content", ""):
                n_bad_prompt += 1
                continue
            gt = truncate_ground_truth(dict(r["reward_model"])["ground_truth"], args.max_tests, args.max_gt_bytes)
            if gt is None:
                n_bad_gt += 1
                continue
            rows.append(
                {
                    "data_source": r["data_source"],
                    "prompt": [{"role": "user", "content": user[0]["content"]}],
                    "ability": "code",
                    "reward_model": {"style": "rule", "ground_truth": gt},
                    "extra_info": dict(r["extra_info"]) if r["extra_info"] is not None else {},
                    "_ptext": user[0]["content"],
                }
            )
        print(f"kept {len(rows)} rows (dropped {n_bad_prompt} bad-prompt, {n_bad_gt} bad-ground-truth)")

        out = pd.DataFrame(rows).drop_duplicates("_ptext").reset_index(drop=True)
        print(f"{len(out)} unique problems after dedup")

        out = out[out["_ptext"].str.len() <= 7000].reset_index(drop=True)
        print(f"{len(out)} rows after 7000-char prefilter")
        cand = out.sample(n=min(args.candidates, len(out)), random_state=args.seed).reset_index(drop=True)

        from transformers import AutoTokenizer

        tok = AutoTokenizer.from_pretrained(args.tokenizer)
        keep_idx, tok_lens = [], []
        for i, r in cand.iterrows():
            ntok = len(tok.apply_chat_template(list(r["prompt"]), add_generation_prompt=True))
            if ntok <= args.max_prompt_tokens:
                keep_idx.append(i)
                tok_lens.append(ntok)
        cand = cand.loc[keep_idx].reset_index(drop=True)
        print(
            f"{len(cand)} candidates <= {args.max_prompt_tokens} prompt tokens "
            f"(mean {sum(tok_lens) / max(len(tok_lens), 1):.0f})"
        )

        n = args.train_size + args.val_size
        assert len(cand) >= n, f"only {len(cand)} candidates for {n} needed"
        sub = cand.sample(n=n, random_state=args.seed + 1).reset_index(drop=True)
        train = sub.iloc[: args.train_size].drop(columns="_ptext")
        val = sub.iloc[args.train_size : n].drop(columns="_ptext")

        row = train.iloc[0]
        assert row["data_source"] in CODE_SOURCES
        p0 = dict(row["prompt"][0])
        assert p0["role"] == "user" and "```python" in p0["content"]
        gt = json.loads(dict(row["reward_model"])["ground_truth"])
        assert len(gt["inputs"]) >= 1 and len(gt["inputs"]) == len(gt["outputs"])
        ntests = [len(json.loads(dict(rm)["ground_truth"])["inputs"]) for rm in train["reward_model"]]
        n_fn = sum(1 for rm in train["reward_model"] if "fn_name" in json.loads(dict(rm)["ground_truth"]))
        print(f"tests/problem: mean {sum(ntests) / len(ntests):.1f} max {max(ntests)}; call-based (fn_name): {n_fn}")
        print("sample prompt (first 400 chars):")
        print(p0["content"][:400])

        os.makedirs(args.out_dir, exist_ok=True)
        train.to_parquet(os.path.join(args.out_dir, "train.parquet"), index=False)
        val.to_parquet(os.path.join(args.out_dir, "val.parquet"), index=False)
        print(f"wrote {len(train)} train / {len(val)} val -> {args.out_dir}")


    if __name__ == "__main__":
        main()

  run_code_rlvr.sh: |
    #!/usr/bin/env bash
    set -xeuo pipefail

    trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

    RESULTS_DIR="/workspace/results"
    MODEL_PATH="/workspace/models/DeepSeek-R1-Distill-Qwen-1.5B"
    TRAIN_FILE="/workspace/data/eurus_code/train.parquet"
    VAL_FILE="/workspace/data/eurus_code/val.parquet"
    RUN_SECS="${RUN_SECONDS:-5400}"
    VERL_COMMIT="983cb0f24443f87b3d161fad318445130a620b07"

    mkdir -p "$RESULTS_DIR"

    echo "=== Phase 0: GPU access without the device plugin (hostPath driver mounts) ==="
    export PATH="/usr/local/nvidia/bin:$PATH"
    export LD_LIBRARY_PATH="/usr/local/nvidia/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    ldconfig /usr/local/nvidia/lib64 2>/dev/null || true

    GPU_MASK="${GPU_MASK:?GPU_MASK env required, e.g. 2,0}"
    SHARED_NODE_IDX="${GPU_MASK%%,*}"
    DEDICATED_NODE_IDX="${GPU_MASK##*,}"

    NVIS=$(nvidia-smi -L | wc -l)
    echo "visible GPUs: $NVIS"
    nvidia-smi -L
    if [ "$NVIS" -ge 3 ]; then
        export CUDA_VISIBLE_DEVICES="$GPU_MASK"
        SHARED_UUID=$(nvidia-smi -i "$SHARED_NODE_IDX" --query-gpu=uuid --format=csv,noheader | tr -d ' ')
        DEDICATED_UUID=$(nvidia-smi -i "$DEDICATED_NODE_IDX" --query-gpu=uuid --format=csv,noheader | tr -d ' ')
    elif [ "$NVIS" = 2 ]; then
        mapfile -t BYBUS < <(nvidia-smi --query-gpu=index,pci.bus_id,uuid --format=csv,noheader | sort -t, -k2)
        DEDICATED_CIDX=$(echo "${BYBUS[0]}" | cut -d, -f1 | tr -d ' ')
        DEDICATED_UUID=$(echo "${BYBUS[0]}" | cut -d, -f3 | tr -d ' ')
        SHARED_CIDX=$(echo "${BYBUS[1]}" | cut -d, -f1 | tr -d ' ')
        SHARED_UUID=$(echo "${BYBUS[1]}" | cut -d, -f3 | tr -d ' ')
        export CUDA_VISIBLE_DEVICES="${SHARED_CIDX},${DEDICATED_CIDX}"
    else
        echo "FATAL: unexpected GPU visibility ($NVIS GPUs)"; exit 96
    fi
    echo "GPU mask resolved: shared=node${SHARED_NODE_IDX} uuid=$SHARED_UUID dedicated=node${DEDICATED_NODE_IDX} uuid=$DEDICATED_UUID CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES"

    echo "=== Phase 1: install verl pinned @ $VERL_COMMIT ==="
    pip install datasets TransferQueue 2>&1 | tail -5
    git clone --depth 1 https://github.com/verl-project/verl.git /workspace/verl-src
    cd /workspace/verl-src
    git fetch --depth 1 origin "$VERL_COMMIT"
    git checkout "$VERL_COMMIT"
    git rev-parse HEAD | tee "$RESULTS_DIR/verl_commit"
    pip install -e ".[gpu]" 2>&1 | tail -10
    cd /workspace
    pip install cupy-cuda12x 2>&1 | tail -3
    python3 -c "import verl; print('verl version:', verl.__version__)"
    python3 -c "import transfer_queue; print('transfer_queue OK')"

    echo "=== Phase 1b: install timeslice lock client + verl plugin wrapper ==="
    pip install "git+https://github.com/llm-d-incubation/llm-d-rl-time-slicing.git#subdirectory=pkg/client/python" 2>&1 | tail -3
    pip install "grpcio>=1.81.0" "protobuf>=7.35.0" 2>&1 | tail -2
    mkdir -p /workspace/timeslice-verl-pkg/timeslice_verl
    cp -L /workspace/timeslice-pkg/__init__.py \
          /workspace/timeslice-pkg/fully_async.py \
          /workspace/timeslice-pkg/locks.py \
          /workspace/timeslice-verl-pkg/timeslice_verl/
    cat > /workspace/timeslice-verl-pkg/pyproject.toml <<'PYPROJ'
    [build-system]
    requires = ["setuptools>=61"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "timeslice-verl"
    version = "0.3.0"
    description = "verl <-> llm-d-rl-time-slicing integration (PoC fully-async overlay)"
    requires-python = ">=3.9"

    [project.entry-points."verl.plugins"]
    timeslice_verl = "timeslice_verl"

    [tool.setuptools]
    packages = ["timeslice_verl"]
    PYPROJ
    pip install -e /workspace/timeslice-verl-pkg 2>&1 | tail -3
    python3 <<'CHK'
    import importlib.metadata as md
    eps = list(md.entry_points(group="verl.plugins"))
    assert any(ep.name == "timeslice_verl" for ep in eps), f"verl.plugins entry point missing: {eps}"
    import timeslice_verl  # noqa: F401
    try:
        from timeslice import OrchestratorClient  # noqa: F401
    except ImportError:
        from timeslice import TimeSliceOrchestratorClient as OrchestratorClient
    print("timeslice wrapper install OK; verl.plugins entry points:", [ep.name for ep in eps])
    CHK

    echo "=== Phase 1c: pyext (prime_code dependency; shim if pip install broken) ==="
    pip install pyext 2>&1 | tail -2 || true
    python3 << 'PYEXTFIX'
    try:
        from pyext import RuntimeModule  # noqa: F401
        print("pyext OK (pip)")
    except Exception:
        import os
        import sysconfig

        SHIM = '''"""Minimal pyext shim: only RuntimeModule.from_string, as used by
    verl.utils.reward_score.prime_code.testing_util (pyext 0.7 does not install on
    Python >= 3.11). Semantically identical: build a module object from source."""
    import types


    class RuntimeModule:
        @staticmethod
        def from_string(name, docstring, code):
            mod = types.ModuleType(name, docstring)
            exec(compile(code, name, "exec"), mod.__dict__)
            return mod
    '''
        sp = sysconfig.get_paths()["purelib"]
        with open(os.path.join(sp, "pyext.py"), "w") as f:
            f.write(SHIM)
        from pyext import RuntimeModule  # noqa: F401

        print(f"pyext shim installed at {sp}/pyext.py")
    PYEXTFIX

    echo "=== Phase 1d: reward smoke test (prime_code local execution, pre-GPU fail-fast) ==="
    python3 << 'REWARDCHECK'
    import json
    import time

    from verl.utils.reward_score import default_compute_score

    gt = json.dumps({"inputs": ["1 2\n", "5 7\n"], "outputs": ["3\n", "12\n"]})

    good = "<think>ok</think>\nFinal solution:\n```python\na, b = map(int, input().split())\nprint(a + b)\n```"
    s = default_compute_score("taco", good, gt)
    print("good ->", s)
    assert s == 1.0, s

    partial = "```python\na, b = map(int, input().split())\nprint(a + b if a == 1 else 0)\n```"
    s = default_compute_score("taco", partial, gt)
    print("partial ->", s)
    assert abs(s - 0.5) < 1e-6, s

    bad = "no code block at all, model rambled"
    s = default_compute_score("taco", bad, gt)
    print("no-block ->", s)
    assert s == 0.0, s

    t0 = time.time()
    loop = "```python\nwhile True:\n    pass\n```"
    s = default_compute_score("taco", loop, gt)
    dt = time.time() - t0
    print(f"infinite-loop -> {s} in {dt:.1f}s")
    assert s == 0.0 and dt < 130, (s, dt)

    fngt = json.dumps({"inputs": ["[3, 1, 2]", "[5]"], "outputs": ["6", "5"], "fn_name": "total"})
    fngood = "```python\nclass Solution:\n    def total(self, xs):\n        return sum(xs)\n```"
    s = default_compute_score("taco", fngood, fngt)
    print("fn_name ->", s)
    assert s == 1.0, s
    print("Reward smoke test OK: pass/partial/fail/timeout/call-based all behave")
    REWARDCHECK

    echo "=== Phase 2: download model (DeepSeek-R1-Distill-Qwen-1.5B, MIT, ungated) ==="
    python3 -c "
    from huggingface_hub import snapshot_download
    snapshot_download('deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B', local_dir='$MODEL_PATH')
    print('Model download complete')
    "

    echo "=== Phase 3: prepare dataset (512 Eurus-2 code prompts, tests capped at 8) ==="
    python3 /workspace/scripts/data_prep.py --out_dir /workspace/data/eurus_code \
        --tokenizer "$MODEL_PATH" --train_size 512 --val_size 64

    echo "=== Phase 3b: chat-template sanity check (forced <think> must be active) ==="
    python3 << 'TMPLCHECK'
    import pandas as pd
    from transformers import AutoTokenizer

    tok = AutoTokenizer.from_pretrained("/workspace/models/DeepSeek-R1-Distill-Qwen-1.5B")
    df = pd.read_parquet("/workspace/data/eurus_code/train.parquet")
    msgs = [dict(m) for m in df.iloc[0]["prompt"]]
    rendered = tok.apply_chat_template(msgs, add_generation_prompt=True, tokenize=False)
    print("RENDERED PROMPT TAIL:", rendered[-200:])
    assert rendered.rstrip().endswith("<think>"), "chat template does not force <think> - CoT premise broken"
    ntok = len(tok.apply_chat_template(msgs, add_generation_prompt=True))
    print(f"prompt tokens: {ntok}")
    assert ntok < 2048, f"prompt longer than max_prompt_length: {ntok}"
    print("Chat template check OK")
    TMPLCHECK

    echo "=== Phase 4: start in-pod GPU monitor (100ms; provenance only) ==="
    bash /workspace/scripts/gpu_monitor.sh "$RESULTS_DIR/gpu_util.csv" 100 &
    MONITOR_PID=$!
    date +%s%3N > "$RESULTS_DIR/start_ts"

    # ORIENTATION WATCHDOG
    POD_CG_TOKEN=$(grep -o 'pod[0-9a-fA-F_-]\{36\}' /proc/self/cgroup | head -1 || true)

    pid_in_pod() {
        [ -n "$POD_CG_TOKEN" ] || return 0
        grep -q "$POD_CG_TOKEN" "/proc/$1/cgroup" 2>/dev/null
    }

    classify_pid() {
        local cmd
        cmd=$(tr '\0' ' ' < "/proc/$1/cmdline" 2>/dev/null || true)
        case "$cmd" in
            *WorkerDict*) echo trainer ;;
            *EngineCore*|*vllm*|*vLLM*|*VLLM*) echo rollout ;;
            *) echo other ;;
        esac
    }

    kill_own_training() {
        local sig="$1" pat p
        for pat in fully_async_main "ray::" vllm python3; do
            for p in $(pgrep -f "$pat" 2>/dev/null || true); do
                [ "$p" = "$$" ] && continue
                pid_in_pod "$p" && kill "-$sig" "$p" 2>/dev/null || true
            done
        done
    }

    orientation_watchdog() {
        set +e
        local ok_logged=0 n=0 viol pid name uuid role seen_trainer seen_rollout
        while true; do
            sleep 15
            viol=0; seen_trainer=""; seen_rollout=""
            while IFS=, read -r pid name uuid; do
                pid=$(echo "$pid" | tr -d ' '); uuid=$(echo "$uuid" | tr -d ' ')
                [ -n "$pid" ] || continue
                pid_in_pod "$pid" || continue
                role=$(classify_pid "$pid")
                if [ "$role" = rollout ] && [ "$uuid" = "$SHARED_UUID" ]; then
                    viol=1; echo "ORIENTATION-VIOLATION vllm pid=$pid ($name) has compute context on SHARED GPU node${SHARED_NODE_IDX}"
                fi
                if [ "$role" = trainer ] && [ "$uuid" = "$DEDICATED_UUID" ]; then
                    viol=1; echo "ORIENTATION-VIOLATION trainer pid=$pid ($name) has compute context on DEDICATED GPU node${DEDICATED_NODE_IDX}"
                fi
                if [ "$role" = trainer ] && [ "$uuid" = "$SHARED_UUID" ]; then seen_trainer=$pid; fi
                if [ "$role" = rollout ] && [ "$uuid" = "$DEDICATED_UUID" ]; then seen_rollout=$pid; fi
            done < <(nvidia-smi --query-compute-apps=pid,process_name,gpu_uuid --format=csv,noheader 2>/dev/null)
            if [ "$viol" = 1 ]; then
                echo "ORIENTATION-FATAL: rollout/trainer GPU orientation violated — killing training"
                nvidia-smi || true
                nvidia-smi --query-compute-apps=pid,process_name,gpu_uuid --format=csv || true
                touch "$RESULTS_DIR/ORIENTATION_FATAL"
                kill_own_training INT; sleep 10
                kill_own_training TERM; sleep 5
                kill_own_training KILL
                return 1
            fi
            if [ -n "$seen_trainer" ] && [ -n "$seen_rollout" ]; then
                if [ "$ok_logged" = 0 ] || [ $((n % 40)) -eq 0 ]; then
                    echo "ORIENTATION-OK trainer=GPU${SHARED_NODE_IDX} rollout=GPU${DEDICATED_NODE_IDX} (trainer_pid=$seen_trainer rollout_pid=$seen_rollout)"
                    ok_logged=1
                fi
            fi
            n=$((n + 1))
        done
    }

    echo "=== Phase 5: fully-async code-RLVR training (BASELINE — solo, no contention) ==="
    echo "  Model: DeepSeek-R1-Distill-Qwen-1.5B | Dataset: Eurus-2-RL-Data code (512 prompts)"
    echo "  Reward: in-tree prime_code, LOCAL test execution on rollouter"
    echo "  lr=${ACTOR_LR:-1e-6} exp=${EXP_NAME:-unnamed} staleness=${STALENESS_THRESHOLD:-8}"
    echo "  timeslice: job=${TIMESLICE_JOB_ID:-?} group=${TIMESLICE_GROUP:-?} orch=${TIMESLICE_ORCH_ADDR:-?}"
    nvidia-smi

    export PYTHONUNBUFFERED=1
    export HYDRA_FULL_ERROR=1

    TOTAL_ROLLOUT_STEPS=65536

    run_training() {
        timeout --signal=INT --kill-after=120 "$RUN_SECS" \
        python3 -m verl.experimental.fully_async_policy.fully_async_main \
            data.train_files="$TRAIN_FILE" \
            data.val_files="$VAL_FILE" \
            data.prompt_key=prompt \
            data.truncation=left \
            data.max_prompt_length=2048 \
            data.max_response_length=16384 \
            data.train_batch_size=0 \
            data.gen_batch_size=1 \
            data.return_raw_chat=True \
            actor_rollout_ref.model.path="$MODEL_PATH" \
            actor_rollout_ref.model.use_remove_padding=True \
            actor_rollout_ref.model.enable_gradient_checkpointing=True \
            actor_rollout_ref.hybrid_engine=False \
            actor_rollout_ref.actor.strategy=fsdp \
            actor_rollout_ref.actor.ppo_mini_batch_size=64 \
            actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1 \
            actor_rollout_ref.actor.use_kl_loss=False \
            actor_rollout_ref.actor.kl_loss_coef=0.0 \
            actor_rollout_ref.actor.entropy_coeff=0 \
            actor_rollout_ref.actor.grad_clip=1.0 \
            actor_rollout_ref.actor.loss_agg_mode=token-mean \
            actor_rollout_ref.actor.use_dynamic_bsz=True \
            actor_rollout_ref.actor.ppo_max_token_len_per_gpu=32768 \
            actor_rollout_ref.actor.optim.lr="${ACTOR_LR:-1e-6}" \
            actor_rollout_ref.actor.optim.lr_warmup_steps=-1 \
            actor_rollout_ref.actor.fsdp_config.param_offload=False \
            actor_rollout_ref.actor.fsdp_config.optimizer_offload=False \
            actor_rollout_ref.ref.log_prob_use_dynamic_bsz=True \
            actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=32768 \
            actor_rollout_ref.rollout.name=vllm \
            actor_rollout_ref.rollout.mode=async \
            actor_rollout_ref.rollout.n=8 \
            actor_rollout_ref.rollout.calculate_log_probs=True \
            actor_rollout_ref.rollout.checkpoint_engine.backend=nccl \
            +actor_rollout_ref.rollout.checkpoint_engine.engine_kwargs.nccl.rebuild_group=True \
            actor_rollout_ref.rollout.gpu_memory_utilization=0.8 \
            actor_rollout_ref.rollout.tensor_model_parallel_size=1 \
            actor_rollout_ref.rollout.max_model_len=18432 \
            actor_rollout_ref.rollout.max_num_batched_tokens=18432 \
            actor_rollout_ref.rollout.enable_chunked_prefill=True \
            actor_rollout_ref.rollout.temperature=1.0 \
            actor_rollout_ref.rollout.top_p=1.0 \
            actor_rollout_ref.rollout.top_k=-1 \
            algorithm.adv_estimator=grpo \
            algorithm.use_kl_in_reward=False \
            algorithm.kl_ctrl.kl_coef=0.0 \
            trainer.logger="['console']" \
            trainer.val_before_train=False \
            trainer.save_freq=-1 \
            trainer.resume_mode=disable \
            trainer.nnodes=1 \
            trainer.n_gpus_per_node=1 \
            trainer.total_epochs=10 \
            trainer.test_freq=-1 \
            trainer.project_name=poc2-baseline \
            trainer.experiment_name="${EXP_NAME:-poc2-code-base}" \
            trainer.default_local_dir="$RESULTS_DIR/ckpts" \
            rollout.nnodes=1 \
            rollout.n_gpus_per_node=1 \
            rollout.total_rollout_steps="$TOTAL_ROLLOUT_STEPS" \
            async_training.staleness_threshold="${STALENESS_THRESHOLD:-8}" \
            async_training.trigger_parameter_sync_step=1 \
            async_training.use_dynamic_resource_scheduling=False \
            async_training.use_trainer_do_validate=False \
            2>&1 | tee "$RESULTS_DIR/train.log"
        return "${PIPESTATUS[0]}"
    }

    set +e
    run_training &
    TRAIN_PID=$!
    orientation_watchdog &
    WATCHDOG_PID=$!
    wait "$TRAIN_PID"
    TRAIN_RC=$?
    kill "$WATCHDOG_PID" 2>/dev/null || true
    set -e
    if [ -f "$RESULTS_DIR/ORIENTATION_FATAL" ]; then
        echo "RUN ABORTED: ORIENTATION-FATAL (see log above)"
        TRAIN_RC=97
    elif [ "$TRAIN_RC" = "124" ]; then
        echo "Training stopped by planned ${RUN_SECS}s timeout (expected end state)"
    elif [ "$TRAIN_RC" != "0" ]; then
        echo "WARNING: training exited rc=$TRAIN_RC before planned timeout"
    fi

    date +%s%3N > "$RESULTS_DIR/end_ts"
    kill "$MONITOR_PID" 2>/dev/null || true
    wait "$MONITOR_PID" 2>/dev/null || true
    wc -l "$RESULTS_DIR/gpu_util.csv" || true

    echo "=== Per-GPU summary (in-pod trace) ==="
    python3 -c "
    import csv
    from collections import defaultdict
    traces = defaultdict(list)
    with open('$RESULTS_DIR/gpu_util.csv') as f:
        for row in csv.DictReader(f):
            traces[int(row['gpu_index'])].append(float(row['gpu_util_pct']))
    for gi in sorted(traces.keys()):
        u = traces[gi]
        n = len(u)
        mean_u = sum(u)/n
        idle = sum(1 for v in u if v <= 15)/n
        busy = sum(1 for v in u if v >= 50)/n
        print(f'GPU {gi}: mean={mean_u:.1f}% idle={idle:.1%} busy={busy:.1%} samples={n}')
    " || true

    echo "=== GPU trace dump (gzip+base64, prefix GPUCSV:) ==="
    echo "GPUCSV-BEGIN md5=$(md5sum "$RESULTS_DIR/gpu_util.csv" | cut -d' ' -f1)"
    gzip -c "$RESULTS_DIR/gpu_util.csv" | base64 -w 3000 | sed 's/^/GPUCSV:/' || true
    echo "GPUCSV-END"
    if [ -f "$RESULTS_DIR/rl_metrics.jsonl" ]; then
        echo "=== rl_metrics dump (gzip+base64, prefix RLMETRICS:) ==="
        echo "RLMETRICS-BEGIN md5=$(md5sum "$RESULTS_DIR/rl_metrics.jsonl" | cut -d' ' -f1)"
        gzip -c "$RESULTS_DIR/rl_metrics.jsonl" | base64 -w 3000 | sed 's/^/RLMETRICS:/' || true
        echo "RLMETRICS-END"
    else
        echo "WARNING: no rl_metrics.jsonl produced (wrapper inactive?)"
    fi

    echo "=== Keeping pod alive for result collection ==="
    sleep 7200
    if [ "$TRAIN_RC" = "97" ]; then exit 97; fi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: poc2-baseline-code
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: poc2-baseline-code
        timeslice.io/job-id: job-a-trainer
        timeslice.io/group: trainers
    spec:
      restartPolicy: Never
      nodeName: ${NODE_NAME}
      hostPID: true
      securityContext:
        seccompProfile:
          type: Unconfined
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-mega-80gb
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - h100-mega-8gpu-spot-b
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: benchmark
        image: verlai/verl:vllm020.dev2
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_PTRACE"]
        env:
        - name: VLLM_USE_V1
          value: "1"
        - name: STALENESS_THRESHOLD
          value: "8"
        - name: RUN_SECONDS
          value: "${RUN_SECONDS}"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "2,0"
        - name: GPU_MASK
          value: "2,0"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: NCCL_CUMEM_ENABLE
          value: "0"
        - name: NCCL_NVLS_ENABLE
          value: "0"
        - name: ACTOR_LR
          value: "1e-6"
        - name: EXP_NAME
          value: "poc2-code-base"
        # --- timeslice wrapper (for metrics parity; solo = no contention) ---
        - name: TIMESLICE_FULLY_ASYNC
          value: "1"
        - name: TIMESLICE_JOB_ID
          value: "job-a-trainer"
        - name: TIMESLICE_ORCH_ADDR
          value: "timeslice-acceleratororchestrator.timeslice-system.svc:50051"
        - name: TIMESLICE_GROUP
          value: "trainers"
        - name: TIMESLICE_METRICS_PATH
          value: "/workspace/results/rl_metrics.jsonl"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          echo "=== POC2 code-RLVR BASELINE solo (lr=1e-6, GPUs node2+node0) ==="
          echo "Node: $(hostname)"
          echo "Date: $(date)"
          bash /workspace/scripts/run_code_rlvr.sh 2>&1 | tee /workspace/results/experiment.log
        resources:
          requests:
            cpu: "40"
            memory: "160Gi"
        volumeMounts:
        - name: scripts
          mountPath: /workspace/scripts
        - name: timeslice-pkg
          mountPath: /workspace/timeslice-pkg
        - name: results
          mountPath: /workspace/results
        - name: nvidia-driver
          mountPath: /usr/local/nvidia
          readOnly: true
        - name: nvidia-devices
          mountPath: /dev
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: scripts
        configMap:
          name: poc2-baseline-code
          defaultMode: 0755
      - name: timeslice-pkg
        configMap:
          name: timeslice-pkg
          defaultMode: 0644
      - name: results
        emptyDir: {}
      - name: nvidia-driver
        hostPath:
          path: /home/kubernetes/bin/nvidia
          type: Directory
      - name: nvidia-devices
        hostPath:
          path: /dev
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
